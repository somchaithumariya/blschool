<script>
/**
 * แกนหลักของหน้าเว็บ: สถานะ, การเรียกเซิร์ฟเวอร์, เมนูแบบหมวด, เส้นทาง (route) และเครื่องมือกลาง
 * หน้าแต่ละกลุ่มอยู่ในไฟล์ Scripts*.html อื่น ๆ และลงทะเบียนผ่าน App.register(route, handler)
 */
(function () {
  'use strict';

  const ROLE_NAMES = { admin: 'ผู้ดูแลระบบ', teacher: 'ครู', executive: 'ผู้บริหาร' };
  // รหัสโรงเรียน (ลิงก์ ?s=...) ทุกโรงเรียนใช้โดเมนเดียวกัน จึงแยกชื่อที่เก็บในเบราว์เซอร์ตามโรงเรียน
  const TENANT = (window.__BOOT__ && window.__BOOT__.tenant) || '';
  const storageKey = (name) => TENANT ? name + '@' + TENANT : name;
  const storedToken = () => { try { return sessionStorage.getItem(storageKey('schoolSessionToken')) || localStorage.getItem(storageKey('schoolRememberToken')) || ''; } catch (error) { return ''; } };
  const state = { tenant: TENANT, baseUrl: (window.__BOOT__ && window.__BOOT__.baseUrl) || '', token: storedToken(), settings: {}, user: null, modules: [],
    configurableModules: [], groups: [], entities: {}, lookups: null, requiresPasswordChange: false, cache: {}, yearId: '', texts: {} };
  const routes = {};
  const el = {};

  const App = window.App = { state, routes, entityActions: {} };

  document.addEventListener('DOMContentLoaded', initialize);

  async function initialize() {
    ['loading-overlay','toast-region','login-view','login-form','login-error','forced-password-view','forced-password-form',
      'forced-password-error','forced-logout-button','app-shell','sidebar','drawer-backdrop','sidebar-navigation',
      'sidebar-school-name','logout-button','menu-button','page-title','page-subtitle','page-content','user-name','user-role',
      'user-avatar','sidebar-avatar','sidebar-user-name','sidebar-user-roles','app-footer','modal','modal-title','modal-body',
      'sos-top-button','login-footer'].forEach((id) => { el[toCamel(id)] = document.getElementById(id); });
    el.loginForm.addEventListener('submit', handleLogin);
    el.forcedPasswordForm.addEventListener('submit', handleForcedPasswordChange);
    el.forcedLogoutButton.addEventListener('click', handleLogout);
    el.logoutButton.addEventListener('click', handleLogout);
    el.menuButton.addEventListener('click', toggleMenu);
    el.drawerBackdrop.addEventListener('click', closeDrawer);
    el.sosTopButton.addEventListener('click', () => App.openSos && App.openSos());
    document.getElementById('register-button').addEventListener('click', openRegister);
    document.querySelectorAll('[data-reveal]').forEach((button) => button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.reveal);
      input.type = input.type === 'password' ? 'text' : 'password';
    }));
    window.addEventListener('hashchange', route);
    // Apps Script ใส่ base target=_top ทำให้ลิงก์ #/เมนู เปิดทั้งหน้าใหม่เป็นจอขาว จึงเปลี่ยน hash เองภายในกรอบ
    document.addEventListener('click', (event) => {
      const link = event.target.closest && event.target.closest('a[href^="#/"]');
      if (!link || event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey) return;
      event.preventDefault();
      const target = link.getAttribute('href');
      if (location.hash === target) route(); else location.hash = target;
    });
    if ((window.__moduleErrors || []).length) {
      toast('บางส่วนของระบบโหลดไม่สำเร็จ กรุณาแจ้งผู้ดูแลระบบ:\n' + window.__moduleErrors.join('\n'), 'error');
    }
    const boot = window.__BOOT__ || {};
    state.landing = boot.landing || null;
    if (!state.landing && !boot.appMode && App.refreshLanding) App.refreshLanding();
    if (boot.settings) applyBranding(boot.settings);
    else { const response = await request('public.settings', null, false); if (response.ok) applyBranding(response.data); }
    if (state.token) await restoreSession();
    if (!state.user && !state.requiresPasswordChange) showLogin();
    if (boot.demoPending) runDemoLoad('demo.step', false);
  }

  // สร้างข้อมูลตัวอย่างเป็นขั้น ๆ พร้อมแถบความคืบหน้า (เรียกซ้ำจนเสร็จ)
  async function runDemoLoad(action, useToken, onDone) {
    let bar = document.getElementById('demo-progress');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'demo-progress';
      bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center';
      document.body.appendChild(bar);
    }
    for (let round = 0; round < 80; round += 1) {
      const response = await request(action, null, useToken);
      if (!response.ok) { bar.textContent = 'สร้างข้อมูลตัวอย่างไม่สำเร็จ: ' + (response.error && response.error.message || ''); setTimeout(() => bar.remove(), 8000); return false; }
      const info = response.data || {};
      bar.textContent = 'กำลังสร้างข้อมูลตัวอย่าง ' + (info.percent || 0) + '% — ' + (info.label || '');
      if (info.done || info.pending === false) {
        bar.textContent = 'สร้างข้อมูลตัวอย่างเสร็จแล้ว กำลังรีเฟรช…';
        if (onDone) onDone(); else setTimeout(() => location.reload(), 1200);
        return true;
      }
      if (info.busy) await new Promise((resolve) => setTimeout(resolve, 4000));
    }
    return false;
  }

  // ---------- การเรียกเซิร์ฟเวอร์ ----------
  // เวลาของคำขอล่าสุด (เซิร์ฟเวอร์ใช้จริง / รวมที่ผู้ใช้รอ) แสดงในศูนย์ผู้ดูแลระบบ
  const timings = [];
  function request(action, data, useToken = true) {
    const begun = Date.now();
    return new Promise((resolve) => {
      google.script.run.withSuccessHandler((response) => {
        timings.unshift({ action, server: response && response.ms, total: Date.now() - begun, at: begun });
        timings.length = Math.min(timings.length, 40);
        if (response && !response.ok && response.error && response.error.code === 'UNAUTHENTICATED' && state.user) {
          clearSession(); showLogin(); toast(response.error.message, 'error');
        }
        resolve(response || { ok: false, error: { code: 'EMPTY', message: 'ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์', fieldErrors: {} } });
      }).withFailureHandler((error) => resolve({ ok: false, data: null,
        error: { code: 'NETWORK_ERROR', message: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้' + (error && error.message ? '\n' + error.message : ''), fieldErrors: {} } }))
        .api({ action, token: useToken ? state.token : '', data, tenant: state.tenant });
    });
  }

  // เรียกพร้อมแสดงสถานะกำลังโหลด และแจ้งข้อผิดพลาดให้เอง
  async function call(action, data, options = {}) {
    const seq = routeSeq;
    if (!options.silent) setLoading(true);
    const response = await request(action, data);
    if (!options.silent) setLoading(false);
    // ผู้ใช้เปลี่ยนหน้าไปแล้วระหว่างรอ: ไม่ต้องทำต่อ (คำสั่งบนเซิร์ฟเวอร์ทำเสร็จแล้วตามปกติ แค่ไม่แสดงผลทับหน้าใหม่)
    if (seq !== routeSeq) { if (!response.ok && !options.quiet) toast(messageOf(response.error), 'error'); return new Promise(() => {}); }
    if (!response.ok && !options.quiet) toast(messageOf(response.error), 'error');
    return response;
  }

  // ---------- เข้าสู่ระบบ ----------
  // เปิดหน้าใหม่/รีเฟรช: แสดงเมนูจากครั้งก่อนทันที แล้วค่อยอัปเดตจากเซิร์ฟเวอร์เบื้องหลัง
  async function restoreSession() {
    const saved = readSavedState();
    if (saved) {
      applyApplicationState(saved);
      showApplication();
      const fresh = await request('app.state');
      if (!state.token) return;
      if (fresh.ok) { applyApplicationState(fresh.data); renderNavigation(); }
      else if (fresh.error && fresh.error.code === 'PASSWORD_CHANGE_REQUIRED') showForcedPassword();
      return;
    }
    setLoading(true);
    const response = await request('app.state');
    setLoading(false);
    if (!response.ok) {
      if (response.error && response.error.code === 'PASSWORD_CHANGE_REQUIRED') { showForcedPassword(); return; }
      clearSession(); return;
    }
    applyApplicationState(response.data);
    showApplication();
  }

  async function handleLogin(event) {
    event.preventDefault();
    clearErrors(el.loginForm);
    el.loginError.textContent = '';
    const form = new FormData(event.currentTarget);
    setLoading(true);
    const response = await request('auth.login', { username: form.get('username'), password: form.get('password'), remember: !!form.get('remember') }, false);
    if (!response.ok) { setLoading(false); showErrors(el.loginForm, response.error); el.loginError.textContent = response.error.message; return; }
    state.token = response.data.token;
    sessionStorage.setItem(storageKey('schoolSessionToken'), state.token);
    // จดจำการเข้าสู่ระบบบนเครื่องนี้ (แอปมือถือ): เก็บไว้หลังปิดเบราว์เซอร์ จนกว่าเซสชันหมดอายุหรือออกจากระบบ
    try { if (form.get('remember')) localStorage.setItem(storageKey('schoolRememberToken'), state.token); else localStorage.removeItem(storageKey('schoolRememberToken')); } catch (error) { /* ignore */ }
    state.user = response.data.user;
    if (state.user.mustChangePassword) { setLoading(false); showForcedPassword(); return; }
    let appState = response.data.state;
    if (!appState) {
      const appResponse = await request('app.state');
      if (!appResponse.ok) { setLoading(false); el.loginError.textContent = appResponse.error.message; clearSession(); return; }
      appState = appResponse.data;
    }
    setLoading(false);
    applyApplicationState(appState);
    showApplication();
    toast('เข้าสู่ระบบแล้ว', 'success');
  }

  async function handleLogout() {
    setLoading(true);
    await request('auth.logout');
    setLoading(false);
    clearSession();
    showLogin();
    if (App.refreshLanding) App.refreshLanding();
  }

  async function handleForcedPasswordChange(event) {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    setLoading(true);
    const response = await request('auth.changePassword', Object.fromEntries(form.entries()));
    if (!response.ok) { setLoading(false); el.forcedPasswordError.textContent = messageOf(response.error); return; }
    const appResponse = await request('app.state');
    setLoading(false);
    if (!appResponse.ok) { el.forcedPasswordError.textContent = appResponse.error.message; return; }
    applyApplicationState(appResponse.data);
    showApplication();
    toast('เปลี่ยนรหัสผ่านแล้ว', 'success');
  }

  function readSavedState() {
    try { return JSON.parse(sessionStorage.getItem(storageKey('schoolAppState')) || 'null'); } catch (error) { return null; }
  }

  function applyApplicationState(data) {
    try { sessionStorage.setItem(storageKey('schoolAppState'), JSON.stringify(data)); } catch (error) { /* พื้นที่ไม่พอ ใช้งานต่อได้ */ }
    state.requiresPasswordChange = false;
    state.user = data.user;
    state.externalLinks = data.externalLinks || [];
    state.lockedModules = data.lockedModules || [];
    state.menuPresets = data.menuPresets || [];
    state.landingSections = data.landingSections || [];
    state.landingFonts = data.landingFonts || [];
    state.ai = data.ai || null;
    state.bots = data.bots || [];
    // สถานะ AI เปลี่ยนได้เมื่อข้อมูลล่าสุดมาถึงหลังเปิดหน้า: ให้ปุ่มน้องบอทแสดง/ซ่อนตามค่าล่าสุด
    if (App.syncBot) setTimeout(App.syncBot, 0);
    // ระบบภายนอกแสดงเป็นเมนูในหมวดที่ผู้ดูแลระบบเลือก (เส้นทาง #/ext-รหัส)
    state.modules = (data.modules || []).concat(state.externalLinks.filter((link) => /^https:\/\//i.test(link.url)).map((link) => ({
      key: 'ext-' + link.id, name: link.name, category: link.category, route: '#/ext-' + String(link.id).toLowerCase().replace(/[^a-z0-9-]/g, ''),
      icon: link.icon, color: link.color, external: true, url: link.url, openMode: link.openMode, description: link.description
    }))).filter((module) => safeRoute(module.route));
    state.configurableModules = data.configurableModules || [];
    state.groups = data.groups || [];
    state.themes = data.themes || [];
    state.entities = data.entities || {};
    state.texts = (data.settings && data.settings.uiTexts && typeof data.settings.uiTexts === 'object') ? data.settings.uiTexts : {};
    applyTexts();
    state.lookups = data.lookups || null;
    const years = (state.lookups && state.lookups.academicYears) || [];
    const active = years.find((year) => year.isActive);
    if (!years.some((year) => year.id === state.yearId)) state.yearId = active ? active.id : (years[0] ? years[0].id : '');
    applyBranding(data.settings);
  }

  // ---------- ข้อความที่ผู้ดูแลระบบแก้ไขเอง (โหมดแก้ไขข้อความ) ----------
  // m:เมนู g:หมวด e:หัวตาราง f:ช่องข้อมูล d:คำอธิบายหน้า s:ข้อความทั่วไป (data-tk)
  function t(key, fallback) { return (state.texts && state.texts[key]) || fallback; }
  function applyTexts() {
    const texts = state.texts || {};
    state.modules.forEach((module) => { if (module.defaultName === undefined) module.defaultName = module.name; module.name = texts['m:' + module.key] || module.defaultName; });
    state.groups.forEach((group) => { if (group.defaultName === undefined) group.defaultName = group.name; group.name = texts['g:' + group.key] || group.defaultName; });
    Object.keys(state.entities).forEach((key) => {
      const entity = state.entities[key];
      if (entity.defaultLabel === undefined) entity.defaultLabel = entity.label;
      entity.label = texts['e:' + key] || entity.defaultLabel;
      (entity.fields || []).forEach((field) => { if (field.defaultLabel === undefined) field.defaultLabel = field.label; field.label = texts['f:' + key + '.' + field.key] || field.defaultLabel; });
    });
    applyStaticTexts();
  }
  function applyStaticTexts() {
    const texts = state.texts || {};
    document.querySelectorAll('[data-tk]').forEach((node) => {
      if (node.dataset.tkDefault === undefined) node.dataset.tkDefault = node.textContent;
      node.textContent = texts['s:' + node.dataset.tk] || node.dataset.tkDefault;
    });
  }

  function applyBranding(settings) {
    state.settings = Object.assign({}, state.settings, settings || {});
    const s = state.settings;
    if (!state.user && s.uiTexts && typeof s.uiTexts === 'object') { state.texts = s.uiTexts; applyStaticTexts(); }
    applyTheme(s.primaryColor, s.sidebarColor);
    document.getElementById('register-link').classList.toggle('hidden', s.allowSelfRegistration !== true);
    document.getElementById('login-title').textContent = s.schoolName || 'ระบบบริหารจัดการโรงเรียน';
    document.getElementById('login-description').textContent = s.schoolDescription || 'ระบบบริหารจัดการโรงเรียน';
    el.loginFooter.textContent = '© ' + (new Date().getFullYear() + 543) + ' ' + (s.footerText || s.schoolName || '');
    document.querySelectorAll('.school-mark,.brand-mark').forEach((mark) => {
      if (s.logoFileId) {
        mark.style.backgroundImage = `url("${App.imageUrl ? App.imageUrl(s.logoFileId, 300) : 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(s.logoFileId) + '&sz=w300'}")`;
        mark.textContent = '';
      } else { mark.style.backgroundImage = ''; mark.textContent = (s.schoolName || 'ร').replace(/^โรงเรียน/, '').slice(0, 1); }
    });
    el.sidebarSchoolName.textContent = s.schoolName || 'ระบบโรงเรียน';
    el.appFooter.textContent = s.footerText || '';
    document.title = s.schoolName || 'ระบบบริหารจัดการโรงเรียน';
    if (App.renderLanding) App.renderLanding();
    renderCredit();
  }

  // ข้อมูลผู้คิดค้นและพัฒนาระบบ (มาจากเซิร์ฟเวอร์ แก้ไขผ่านหน้าจอไม่ได้) ถ้าถูกลบออกจากหน้าจะใส่กลับให้
  function renderCredit() {
    const credit = (window.__BOOT__ && window.__BOOT__.credit) || null;
    if (!credit || !credit.text) return;
    const places = [['.site-footer', 'dev-credit'], ['#login-dialog .login-card, #login-dialog section', 'dev-credit login'], ['#app-footer', 'dev-credit app', true]];
    places.forEach(([selector, className, after]) => {
      const parent = document.querySelector(selector);
      if (!parent) return;
      const scope = after ? parent.parentElement : parent;
      if (!scope.querySelector(':scope > [data-credit]')) {
        const node = Object.assign(document.createElement('p'), { className });
        node.setAttribute('data-credit', '');
        if (after) parent.after(node); else parent.appendChild(node);
      }
    });
    document.querySelectorAll('[data-credit]').forEach((node) => { if (node.textContent !== credit.text) node.textContent = credit.text; node.hidden = false; node.style.display = ''; });
  }

  function applyTheme(primaryColor, sidebarColor) {
    const valid = (value) => /^#[0-9a-f]{6}$/i.test(String(value || ''));
    document.documentElement.style.setProperty('--primary', valid(primaryColor) ? primaryColor : '#1e3a5f');
    document.documentElement.style.setProperty('--nav-bg', valid(sidebarColor) ? sidebarColor : '#0f1b33');
  }

  // ---------- สมัครสมาชิก ----------
  function closeLoginDialog() { const dialog = document.getElementById('login-dialog'); if (dialog && dialog.open) dialog.close(); }

  function openRegister() {
    closeLoginDialog();
    const body = openModal('สมัครสมาชิก', `<form class="form-grid" novalidate>
      <label>ชื่อผู้ใช้ (a-z 0-9) <span class="c-rose">*</span><input name="username" autocomplete="username" required><small class="field-error" data-error-for="username"></small></label>
      <label>ชื่อ-นามสกุล <span class="c-rose">*</span><input name="displayName" required><small class="field-error" data-error-for="displayName"></small></label>
      <label>เบอร์โทรศัพท์<input name="phone" inputmode="tel"><small class="field-error" data-error-for="phone"></small></label>
      <label>อีเมล<input name="email" type="email"><small class="field-error" data-error-for="email"></small></label>
      <label>รหัสผ่าน <span class="c-rose">*</span><input name="password" type="password" autocomplete="new-password" required><small class="field-error" data-error-for="password"></small></label>
      <label>ยืนยันรหัสผ่าน <span class="c-rose">*</span><input name="confirm" type="password" autocomplete="new-password" required><small class="field-error" data-error-for="confirm"></small></label>
      <p class="muted wide">หลังสมัคร ผู้ดูแลระบบจะตรวจสอบและกำหนดสิทธิ์ก่อนจึงจะเข้าใช้งานได้</p>
      <p class="form-error wide" data-form-error></p>
      <div class="form-actions wide"><button type="button" class="secondary-button" data-cancel>ยกเลิก</button>
        <button type="submit" class="primary-button"><i class="fa-solid fa-user-plus"></i> สมัครสมาชิก</button></div></form>`);
    const form = body.querySelector('form');
    body.querySelector('[data-cancel]').addEventListener('click', closeModal);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearErrors(form);
      const values = Object.fromEntries(new FormData(form).entries());
      if (values.password !== values.confirm) { showErrors(form, { fieldErrors: { confirm: 'รหัสผ่านไม่ตรงกัน' } }); return; }
      setLoading(true);
      const response = await request('auth.register', values, false);
      setLoading(false);
      if (!response.ok) { showErrors(form, response.error); form.querySelector('[data-form-error]').textContent = response.error.message; return; }
      body.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-circle-check c-green"></i></div><h2>ส่งคำขอสมัครแล้ว</h2><p>กรุณารอผู้ดูแลระบบอนุมัติ แล้วเข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านที่ตั้งไว้</p></div>';
    });
  }

  function showApplication() {
    closeLoginDialog();
    el.loginView.classList.add('hidden');
    el.forcedPasswordView.classList.add('hidden');
    el.appShell.classList.remove('hidden');
    const name = state.user.displayName || state.user.username;
    const roles = (state.user.roles || []).map((key) => ROLE_NAMES[key] || key);
    el.userName.textContent = name; el.sidebarUserName.textContent = name;
    el.userRole.textContent = roles.join(' , ');
    el.sidebarUserRoles.innerHTML = roles.map((role) => `<span class="role-chip">${esc(role)}</span>`).join('');
    el.userAvatar.textContent = name.slice(0, 1); el.sidebarAvatar.textContent = name.slice(0, 1);
    renderNavigation();
    // ลิงก์จากการแจ้งเตือน (เช่น ใบลารออนุมัติ): เปิดเมนูนั้นและรายการนั้นทันที (ครั้งเดียว)
    const open = window.__BOOT__ && window.__BOOT__.open;
    // รายงานที่ครูส่งถึงผู้บริหาร: เปิดหน้า "ส่งรายงานถึงผู้บริหาร" แล้วเปิดรายงานนั้น
    if (open && !state.openConsumed && open.entity === 'report-reviews' && can('review.view')) {
      state.openConsumed = true;
      App.pendingReview = open.id;
      if (location.hash === '#/report-reviews') route(); else location.hash = '#/report-reviews';
      return;
    }
    if (open && !state.openConsumed && state.entities[open.entity] && can(state.entities[open.entity].viewPermission)) {
      state.openConsumed = true;

  // ---------- เส้นทาง ----------

  async function route() {

    routeSeq += 1;

    const hash = location.hash || '#/dashboard';
    markActive();
    const module = state.modules.find((item) => item.route === hash);
    if (!module) {
      const exists = routes[hash] || Object.values(state.entities).some((entity) => '#/' + entity.module === hash);
      setPage(exists ? 'ไม่มีสิทธิ์เข้าถึง' : 'ไม่พบหน้า', '');

      else content('<section class="empty-state panel"><h2>ไม่พบหน้าที่ต้องการ</h2><a class="secondary-button" href="#/dashboard">กลับสู่แดชบอร์ด</a></section>');

  // คำอธิบายใต้ชื่อหน้า (ผู้ดูแลระบบเขียนเองได้ในโหมดแก้ไขข้อความ)

  const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  function csvCell(value) { const text = String(value ?? ''); return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text; }
  // \u0e2a\u0e31\u0e48\u0e07\u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e44\u0e1f\u0e25\u0e4c CSV \u0e41\u0e25\u0e30\u0e40\u0e1b\u0e34\u0e14\u0e2b\u0e19\u0e49\u0e32\u0e15\u0e48\u0e32\u0e07\u0e2a\u0e33\u0e23\u0e2d\u0e07\u0e44\u0e27\u0e49\u0e40\u0e2a\u0e21\u0e2d
  // (\u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e02\u0e2d\u0e07 Apps Script \u0e2d\u0e22\u0e39\u0e48\u0e43\u0e19 iframe \u0e17\u0e35\u0e48\u0e1a\u0e32\u0e07\u0e40\u0e1a\u0e23\u0e32\u0e27\u0e4c\u0e40\u0e0b\u0e2d\u0e23\u0e4c/\u0e41\u0e2d\u0e1b\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d/\u0e40\u0e1a\u0e23\u0e32\u0e27\u0e4c\u0e40\u0e0b\u0e2d\u0e23\u0e4c\u0e43\u0e19\u0e42\u0e1b\u0e23\u0e41\u0e01\u0e23\u0e21\u0e41\u0e0a\u0e17 \u0e1a\u0e25\u0e47\u0e2d\u0e01\u0e01\u0e32\u0e23\u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e42\u0e14\u0e22\u0e44\u0e21\u0e48\u0e41\u0e08\u0e49\u0e07
  //  \u0e1c\u0e39\u0e49\u0e43\u0e0a\u0e49\u0e08\u0e36\u0e07\u0e21\u0e35\u0e17\u0e32\u0e07\u0e40\u0e25\u0e37\u0e2d\u0e01: \u0e01\u0e14\u0e1b\u0e38\u0e48\u0e21\u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e2d\u0e35\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07 \u0e2b\u0e23\u0e37\u0e2d\u0e04\u0e31\u0e14\u0e25\u0e2d\u0e01\u0e44\u0e1b\u0e27\u0e32\u0e07\u0e43\u0e19 Google Sheets/Excel)
  function downloadCsv(filename, header, rows, options = {}) {

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });

        \u0e2b\u0e32\u0e01\u0e40\u0e1a\u0e23\u0e32\u0e27\u0e4c\u0e40\u0e0b\u0e2d\u0e23\u0e4c\u0e44\u0e21\u0e48\u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e43\u0e2b\u0e49\u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34 \u0e40\u0e25\u0e37\u0e2d\u0e01\u0e27\u0e34\u0e18\u0e35\u0e43\u0e14\u0e27\u0e34\u0e18\u0e35\u0e2b\u0e19\u0e36\u0e48\u0e07\u0e14\u0e49\u0e32\u0e19\u0e25\u0e48\u0e32\u0e07</p>
      <div class="form-actions" style="justify-content:flex-start;flex-wrap:wrap">
        <a class="primary-button" href="${url}" download="${attr(filename)}" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> \u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e44\u0e1f\u0e25\u0e4c</a>

      <textarea readonly rows="7" style="width:100%;margin-top:10px;font-family:monospace;font-size:.85rem" data-text></textarea>`);
    const area = body.querySelector('[data-text]');
    area.value = tsv.length > 60000 ? tsv.slice(0, 60000) + '\n\u2026 (\u0e41\u0e2a\u0e14\u0e07\u0e1a\u0e32\u0e07\u0e2a\u0e48\u0e27\u0e19 \u0e43\u0e0a\u0e49\u0e1b\u0e38\u0e48\u0e21\u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e23\u0e31\u0e1a\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e04\u0e23\u0e1a)' : tsv;

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);

    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  // อ่านได้ทั้ง CSV (คั่นด้วย ,) และข้อมูลที่คัดลอกจาก Excel/Google Sheets (คั่นด้วยแท็บ) โดยดูจากแถวแรก
  function parseCsv(text) {
    const first = String(text).replace(/^﻿/, '').split(/\r?\n/)[0] || '';
    const delimiter = first.includes('\t') && !first.includes(',') ? '\t' : ',';
    const rows = []; let row = []; let cell = ''; let quoted = false;
    const source = text.replace(/^\ufeff/, '');
    for (let index = 0; index < source.length; index += 1) {
      const char = source[index];
      if (quoted) {
        if (char === '"' && source[index + 1] === '"') { cell += '"'; index += 1; }
        else if (char === '"') quoted = false; else cell += char;
      } else if (char === '"') quoted = true;
      else if (char === delimiter) { row.push(cell); cell = ''; }
      else if (char === '\n' || char === '\r') { if (char === '\r' && source[index + 1] === '\n') index += 1; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += char;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((items) => items.some((value) => String(value).trim() !== ''));
  }
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {

      reader.readAsDataURL(file);

  async function openFile(fileId) {
    const response = await call('file.get', { fileId });

    const blob = new Blob([bytes], { type: response.data.mimeType });

  // เก็บข้อมูลที่โหลดแล้วไว้ในหน่วยความจำของหน้า เพื่อเปิดซ้ำได้ทันที
  function cached(key) { return state.cache[key]; }
