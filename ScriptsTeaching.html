<script>
/**
 * งานบันทึกของครูรายวัน
 * - บันทึกหลังการสอน (ตารางกลาง 'teaching-logs'): ปุ่ม "ให้น้องวิชาการวิเคราะห์" ในฟอร์ม และพิมพ์บันทึกรายครั้ง
 * - บันทึกโฮมรูม (หน้าเฉพาะ #/homeroom-logs): 1 ห้องต่อ 1 วัน ปฏิทินรายเดือน ดึงจำนวนมาเรียนจากการเช็กชื่อคาบแรก และรายงานประจำเดือน
 */
(function () {
  'use strict';
  const App = window.App;
  const { esc, attr } = App;
  const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const WEEKDAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  const pre = (text) => `<div class="pre">${esc(text || '-')}</div>`;

  function longDate(iso) {
    const [year, month, day] = String(iso || '').split('-').map(Number);
    if (!year) return '';
    const weekday = WEEKDAYS[new Date(year, month - 1, day).getDay()];
    return `วัน${weekday}ที่ ${day} ${THAI_MONTHS[month - 1]} ${year + 543}`;
  }

  async function signerNames(yearId) {
    const key = 'entity:approval-positions:' + yearId;
    let rows = App.cached(key);
    if (!rows) {
      const response = await App.request('entity.list', { entity: 'approval-positions', academicYearId: yearId });
      rows = App.remember(key, response.ok ? response.data.rows : []);
    }
    return Object.fromEntries(rows.map((row) => [row.role, App.personName(row.personnelId)]));
  }
  const signBlock = (people) => `<div class="sign">${people.map(([title, name]) =>
    `<div>ลงชื่อ ..........................................<br>(${esc(name || '..........................................')})<br>${esc(title)}</div>`).join('')}</div>`;

  // =====================================================================
  // บันทึกหลังการสอน
  // =====================================================================
  const PLACEHOLDERS = {
    teachingMethod: 'เช่น บรรยายประกอบสไลด์ 20 นาที แล้วให้ทำใบงานรายบุคคล',
    resultK: 'เช่น นักเรียนส่วนใหญ่อธิบายความหมายของเศษส่วนได้ แต่ยังเปรียบเทียบเศษส่วนที่ตัวส่วนไม่เท่ากันไม่ได้',
    resultP: 'เช่น ทำงานกลุ่มได้ แต่การนำเสนอยังไม่เป็นลำดับขั้นตอน',
    resultA: 'เช่น สนใจช่วงกิจกรรม แต่ช่วงบรรยายมีนักเรียนคุยกันและไม่จดบันทึก',
    problems: 'เล่าปัญหาที่เจอให้ชัด เช่น นักเรียนประมาณ 12 คนแก้โจทย์ปัญหาไม่ได้ ไม่กล้าถามครู งานกลุ่มมีคนทำจริงแค่ 1–2 คน เวลาไม่พอสรุปบทเรียน',
    nextSteps: 'สิ่งที่ครูตัดสินใจทำในคาบถัดไป (เลือกจากผลวิเคราะห์หรือเขียนเอง)'
  };

  App.entityDefaults['teaching-logs'] = () => ({ teacherId: App.state.user.personnelId || '', teachDate: App.todayIso(), academicYearId: App.state.yearId });

  App.entityFormReady['teaching-logs'] = async (form, row) => {
    Object.entries(PLACEHOLDERS).forEach(([key, text]) => { if (form.elements[key]) form.elements[key].placeholder = text; });
    const roomSelect = form.elements.homeroomId;
    roomSelect.addEventListener('change', async () => {
      if (!roomSelect.value || form.elements.studentsTotal.value) return;
      const response = await App.call('roster.get', { homeroomId: roomSelect.value }, { silent: true, quiet: true });
      if (response.ok && !form.elements.studentsTotal.value) form.elements.studentsTotal.value = response.data.length || '';
    });
    const target = form.elements.aiAnalysis.closest('label');
    const box = document.createElement('div');
    box.className = 'wide tl-ai';
    box.innerHTML = `<div class="tl-ai-head"><span class="tl-ai-mark"><i class="fa-solid fa-book-open"></i></span>
        <div><strong>ให้น้องวิชาการช่วยวิเคราะห์</strong><small>อ่านปัญหาและผลการสอนด้านบน แล้วเสนอสาเหตุ รูปแบบ Active Learning ที่แก้ได้ พร้อมขั้นตอนและร่องรอยการเรียนรู้เชิงรุก และแนวทางปรับแผน (เดิม → ปรับเป็น)</small></div></div>
      <div class="tl-ai-actions"><button type="button" class="primary-button" data-analyze><i class="fa-solid fa-wand-magic-sparkles"></i> ให้น้องวิชาการวิเคราะห์</button>
        <small class="muted" data-ai-note></small></div>`;
    target.before(box);
    const button = box.querySelector('[data-analyze]');
    const note = box.querySelector('[data-ai-note]');
    const status = await App.aiStatus();
    if (!status.bot) {
      button.disabled = true;
      note.textContent = 'ใช้ได้เมื่อผู้ดูแลระบบเปิดน้องบอทและใส่ API key ที่ “ศูนย์ผู้ดูแลระบบ”';
    }
    button.addEventListener('click', async () => {
      App.clearErrors(form);
      const values = {};
      Array.from(form.elements).forEach((input) => { if (input.name && input.type !== 'file') values[input.name] = input.value; });
      if (!values.problems.trim()) {
        App.showErrors(form, { fieldErrors: { problems: 'เล่าปัญหาที่พบในคาบนี้ก่อน น้องวิชาการจะวิเคราะห์จากปัญหานี้' } });
        form.elements.problems.focus();
        return;
      }
      const output = form.elements.aiAnalysis;
      if (output.value.trim() && !confirm('แทนที่ผลวิเคราะห์เดิมในช่องด้วยผลวิเคราะห์ใหม่?')) return;
      button.disabled = true;
      button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังวิเคราะห์…';
      note.textContent = 'ใช้เวลาประมาณ 10–40 วินาที';
      const response = await App.call('teaching.analyze', { values, id: row && row.id }, { silent: true, quiet: true });
      button.disabled = false;
      button.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> วิเคราะห์ใหม่';
      if (!form.isConnected) return;
      if (!response.ok) {
        App.showErrors(form, response.error);
        note.textContent = App.messageOf(response.error);
        return;
      }
      output.value = response.data.text;
      output.rows = 16;
      note.textContent = 'เติมผลลงช่องด้านล่างแล้ว ตรวจทานและแก้ไขได้ก่อนกด “บันทึก”';
      output.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  };

  App.entityActions['teaching-logs'] = [{ label: 'พิมพ์', icon: 'fa-print', handler: printTeachingLog }];

  async function printTeachingLog(log) {
    if (!log) return;
    const s = App.state.settings || {};
    const people = await signerNames(log.academicYearId);
    const total = Number(log.studentsTotal) || 0;
    const passed = log.studentsPassed === '' || log.studentsPassed === undefined ? null : Number(log.studentsPassed);
    const rate = total && passed !== null ? ` (ร้อยละ ${Math.round(passed * 1000 / total) / 10})` : '';
    App.printHtml('บันทึกหลังการสอน', `<h2 class="center">บันทึกหลังการจัดการเรียนรู้</h2><p class="center">${esc(s.schoolName || '')}</p>
      <table><tr><th style="width:22%">รายวิชา</th><td>${esc(log.subjectName)}</td><th style="width:16%">ห้อง</th><td>${esc(App.label('homerooms', log.homeroomId) || '-')}</td></tr>
        <tr><th>วันที่สอน</th><td>${esc(longDate(log.teachDate))}</td><th>คาบที่</th><td>${esc(log.period || '-')}</td></tr>
        <tr><th>เรื่อง/หน่วยการเรียนรู้</th><td colspan="3">${esc(log.topic)}</td></tr>
        <tr><th>ครูผู้สอน</th><td colspan="3">${esc(App.personName(log.teacherId))}</td></tr></table>
      <h3>1. วิธีสอน/กิจกรรมที่ใช้</h3>${pre(log.teachingMethod)}
      <h3>2. ผลการจัดการเรียนรู้</h3>
      <table><tr><th style="width:30%">ด้านความรู้ (K)</th><td class="pre">${esc(log.resultK || '-')}</td></tr>
        <tr><th>ด้านทักษะกระบวนการ (P)</th><td class="pre">${esc(log.resultP || '-')}</td></tr>
        <tr><th>ด้านเจตคติ/คุณลักษณะ (A)</th><td class="pre">${esc(log.resultA || '-')}</td></tr>
        <tr><th>นักเรียนผ่านจุดประสงค์</th><td>${passed === null ? '-' : esc(passed)} จาก ${esc(total || '-')} คน${rate}</td></tr></table>
      <h3>3. ปัญหา/อุปสรรคที่พบ</h3>${pre(log.problems)}
      <h3>4. ผลวิเคราะห์และแนวทางแก้ไข</h3>${pre(log.aiAnalysis)}
      <h3>5. แนวทางที่ครูเลือกนำไปใช้</h3>${pre(log.nextSteps)}
      <h3>ความเห็นของผู้บริหาร</h3><p>..............................................................................................................................................................<br>..............................................................................................................................................................</p>
      ${signBlock([['ครูผู้สอน', App.personName(log.teacherId)], ['รองผู้อำนวยการฝ่ายวิชาการ', people['รองผู้อำนวยการฝ่ายวิชาการ'] || s.academicHeadName],
        ['ผู้อำนวยการโรงเรียน', people['ผู้อำนวยการโรงเรียน'] || s.directorName]])}`);
  }

  // =====================================================================
  // บันทึกโฮมรูมรายวัน
  // =====================================================================
  const TOPIC_PRESETS = ['แจ้งข่าวสาร/ประชาสัมพันธ์', 'อบรมคุณธรรม จริยธรรม', 'ตรวจระเบียบและการแต่งกาย', 'ตรวจสุขภาพและความสะอาด',
    'แนะแนวการเรียน', 'ติดตามงานค้าง/การบ้าน', 'ความปลอดภัยและยาเสพติด', 'กิจกรรมวันสำคัญ', 'พูดคุยรับฟังปัญหานักเรียน'];
  const COUNTS = [['present', 'มา', 'ok'], ['late', 'สาย', 'late'], ['leave', 'ลา', 'leave'], ['absent', 'ขาด', 'absent']];

  function hrState() { return App.cached('ui:homeroom-logs') || App.remember('ui:homeroom-logs', { homeroomId: '', date: '', filters: {}, q: '' }); }

  function roomChoices() {
    const mine = App.state.user.personnelId;
    const rooms = App.lookupList('homerooms').filter((room) => String(room.academicYearId) === String(App.state.yearId));
    const own = rooms.filter((room) => mine && (room.advisorId === mine || room.coAdvisorId === mine));
    return { rooms: own.concat(rooms.filter((room) => !own.includes(room))), own };
  }

  App.register('#/homeroom-logs', async () => {
    const ui = hrState();
    const { rooms, own } = roomChoices();
    if (!rooms.some((room) => room.id === ui.homeroomId)) ui.homeroomId = (own[0] || rooms[0] || {}).id || '';
    if (!ui.date) ui.date = App.todayIso();
    ui.filters = { homeroomId: ui.homeroomId };
    App.content(`<section class="panel no-print"><div class="toolbar">
        <label>ปีการศึกษา<select data-year>${App.yearOptions()}</select></label>
        <label>ห้องเรียน<select data-room>${rooms.map((room) => `<option value="${attr(room.id)}" ${room.id === ui.homeroomId ? 'selected' : ''}>${esc(room.label)}${own.includes(room) ? ' (ห้องที่ปรึกษา)' : ''}</option>`).join('') || '<option value="">ยังไม่มีห้องเรียนในปีนี้</option>'}</select></label>
        <label>วันที่<input type="date" data-date value="${attr(ui.date)}" max="${attr(App.todayIso())}"></label>
        <div class="actions"><button type="button" class="secondary-button" data-month-report ${ui.homeroomId ? '' : 'disabled'}><i class="fa-solid fa-print"></i> รายงานประจำเดือน</button></div></div>
        ${!own.length && App.state.user.personnelId ? '<p class="muted">คุณยังไม่ได้เป็นครูที่ปรึกษาห้องใดในปีนี้ ดูบันทึกของห้องอื่นได้ แต่บันทึกได้เฉพาะครูที่ปรึกษาของห้องนั้น</p>' : ''}</section>
      <div id="hr-body"></div>`);
    const root = document.getElementById('page-content');
    root.querySelector('[data-year]').addEventListener('change', (event) => { App.state.yearId = event.target.value; ui.homeroomId = ''; App.route(); });
    root.querySelector('[data-room]').addEventListener('change', (event) => { ui.homeroomId = event.target.value; ui.filters = { homeroomId: ui.homeroomId }; loadDay(); });
    root.querySelector('[data-date]').addEventListener('change', (event) => { if (event.target.value) { ui.date = event.target.value; loadDay(); } });
    root.querySelector('[data-month-report]').addEventListener('click', () => printMonth(ui.homeroomId, ui.date.slice(0, 7)));
    if (!ui.homeroomId) {
      document.getElementById('hr-body').innerHTML = '<section class="panel empty-state"><p class="muted">ยังไม่มีห้องเรียนในปีการศึกษานี้ เพิ่มได้ที่เมนู “ตั้งค่าครูที่ปรึกษา”</p></section>';
      return;
    }
    await loadDay();
  });

  async function loadDay() {
    const ui = hrState();
    const target = document.getElementById('hr-body');
    if (!target) return;
    const dateInput = document.querySelector('#page-content [data-date]');
    if (dateInput) dateInput.value = ui.date;
    const response = await App.call('homeroomLog.day', { homeroomId: ui.homeroomId, date: ui.date });
    if (!response.ok || !document.getElementById('hr-body')) return;
    renderDay(response.data);
  }

  function calendarHtml(data, date) {
    const [year, month] = date.split('-').map(Number);
    const days = new Date(year, month, 0).getDate();
    const lead = (new Date(year, month - 1, 1).getDay() + 6) % 7; // เริ่มสัปดาห์วันจันทร์
    const today = App.todayIso();
    const recorded = new Set(data.recordedDates);
    let workdays = 0, done = 0;
    const cells = [];
    for (let index = 0; index < lead; index += 1) cells.push('<span class="hr-day blank"></span>');
    for (let day = 1; day <= days; day += 1) {
      const iso = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const weekday = new Date(year, month - 1, day).getDay();
      const weekend = weekday === 0 || weekday === 6;
      const future = iso > today;
      if (!weekend && !future) { workdays += 1; if (recorded.has(iso)) done += 1; }
      const classes = ['hr-day', recorded.has(iso) ? 'done' : '', weekend ? 'weekend' : '', future ? 'future' : '', iso === date ? 'current' : '',
        iso === today ? 'today' : '', !weekend && !future && !recorded.has(iso) ? 'missing' : ''].filter(Boolean).join(' ');
      cells.push(`<button type="button" class="${classes}" data-day="${iso}" ${future ? 'disabled' : ''} title="${attr(longDate(iso))}${recorded.has(iso) ? ' · บันทึกแล้ว' : ''}">${day}</button>`);
    }
    return `<div class="hr-cal-head"><button type="button" class="icon-button" data-shift="-1" title="เดือนก่อน"><i class="fa-solid fa-chevron-left"></i></button>
        <strong>${THAI_MONTHS[month - 1]} ${year + 543}</strong>
        <button type="button" class="icon-button" data-shift="1" title="เดือนถัดไป" ${`${year}-${String(month).padStart(2, '0')}` >= today.slice(0, 7) ? 'disabled' : ''}><i class="fa-solid fa-chevron-right"></i></button></div>
      <div class="hr-cal">${['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'].map((name) => `<span class="hr-dow">${name}</span>`).join('')}${cells.join('')}</div>
      <div class="hr-progress"><div><strong>${done}</strong> / ${workdays} วันทำการ</div><span class="hr-bar"><span style="width:${workdays ? Math.round(done * 100 / workdays) : 0}%"></span></span>
        <small class="muted" title="นับวันจันทร์–ศุกร์ถึงวันนี้ ยังไม่หักวันหยุดในปฏิทินโรงเรียน"><span class="hr-key done"></span> บันทึกแล้ว <span class="hr-key missing"></span> ยังไม่บันทึก</small></div>`;
  }

  function renderDay(data) {
    const ui = hrState();
    const record = data.record || {};
    const editable = data.canEdit;
    const lock = editable ? '' : 'disabled';
    const auto = !data.record && data.attendance;
    const counts = COUNTS.map(([key]) => [key, data.record ? record[key] : (data.attendance ? data.attendance[key] : '')]);
    const followed = new Set(String(record.followStudentIds || '').split(',').filter(Boolean));
    const attendanceNote = data.attendance
      ? `เช็กชื่อคาบที่ ${esc(data.attendance.period)} ของวันนั้นได้ มา ${esc(data.attendance.present)} สาย ${esc(data.attendance.late)} ลา ${esc(data.attendance.leave)} ขาด ${esc(data.attendance.absent)} (นักเรียนในห้อง ${esc(data.attendance.total)} คน)${data.record ? '' : ' · แก้ไขได้ก่อนบันทึก'}`
      : `วันนั้นยังไม่มีการเช็กชื่อ กรอกจำนวนเองได้ (นักเรียนในห้อง ${esc(data.roster.length)} คน)`;
    document.getElementById('hr-body').innerHTML = `<div class="hr-layout">
      <section class="panel hr-side">${calendarHtml(data, ui.date)}</section>
      <section class="panel hr-main"><div class="panel-head"><div><h2>โฮมรูม ห้อง ${esc(data.room.label)}</h2>
          <p>${esc(longDate(ui.date))} · ครูที่ปรึกษา ${esc(App.personName(data.room.advisorId) || '-')}${data.room.coAdvisorId ? ' · ' + esc(App.personName(data.room.coAdvisorId)) : ''}</p></div>
          <span class="badge ${data.record ? 'success' : 'warning'}">${data.record ? 'บันทึกแล้ว' : 'ยังไม่บันทึก'}</span></div>
        ${data.holiday ? `<p class="hr-note"><i class="fa-solid fa-umbrella-beach"></i> วันนี้เป็นวันหยุดในปฏิทินโรงเรียน: ${esc(data.holiday)}</p>` : ''}
        ${!editable ? '<p class="hr-note"><i class="fa-solid fa-eye"></i> ดูได้อย่างเดียว บันทึกได้เฉพาะครูที่ปรึกษาของห้องนี้</p>' : ''}
        <form class="hr-form" novalidate>
          <fieldset class="hr-block"><legend>จำนวนนักเรียน</legend>
            <div class="hr-counts">${counts.map(([key, value], index) => `<label class="hr-count ${COUNTS[index][2]}">${COUNTS[index][1]}
              <input name="${key}" type="number" min="0" max="200" inputmode="numeric" value="${attr(value ?? '')}" ${lock}></label>`).join('')}</div>
            <small class="muted">${auto ? '<i class="fa-solid fa-link"></i> ' : ''}${attendanceNote}</small></fieldset>
          <fieldset class="hr-block"><legend>กิจกรรม/หัวข้อโฮมรูม <span class="c-rose">*</span></legend>
            ${editable ? `<div class="hr-chips">${TOPIC_PRESETS.map((topic) => `<button type="button" class="hr-chip" data-topic="${attr(topic)}">${esc(topic)}</button>`).join('')}</div>` : ''}
            <textarea name="topics" rows="4" maxlength="2000" placeholder="กดหัวข้อด้านบนเพื่อเติม แล้วเขียนรายละเอียดเพิ่มได้" ${lock}>${esc(record.topics || '')}</textarea>
            <small class="field-error" data-error-for="topics"></small></fieldset>
          <fieldset class="hr-block"><legend>เรื่องที่นักเรียนแจ้ง/ปัญหาที่พบ</legend>
            <textarea name="studentIssues" rows="3" maxlength="3000" placeholder="เช่น นักเรียนแจ้งว่าป่วยหลายคน มีเรื่องทะเลาะกันในห้อง" ${lock}>${esc(record.studentIssues || '')}</textarea></fieldset>
          <fieldset class="hr-block"><legend>นักเรียนที่ต้องติดตาม <small class="muted" data-follow-count></small></legend>
            ${data.roster.length ? `<div class="hr-students">${data.roster.map((student) => `<label class="hr-student"><input type="checkbox" value="${attr(student.studentId)}" ${followed.has(student.studentId) ? 'checked' : ''} ${lock}>
              <span><b>${esc(student.number)}</b> ${esc(student.name)}</span></label>`).join('')}</div>` : '<p class="muted">ยังไม่มีรายชื่อนักเรียนในห้องนี้ (เพิ่มที่เมนู “นักเรียนรายห้อง/รายปี”)</p>'}</fieldset>
          <fieldset class="hr-block"><legend>การดำเนินการ/การส่งต่อ</legend>
            <textarea name="followNote" rows="3" maxlength="3000" placeholder="เช่น โทรแจ้งผู้ปกครอง นัดพูดคุยรายบุคคล ส่งต่อครูแนะแนว" ${lock}>${esc(record.followNote || '')}</textarea></fieldset>
          <fieldset class="hr-block"><legend>ภาพกิจกรรม</legend>
            ${editable ? '<input name="photo" type="file" accept="image/*">' : ''}
            ${record.photoFileId ? `<small class="muted">มีภาพแล้ว <button type="button" class="ghost-button" data-photo><i class="fa-regular fa-image"></i> เปิดภาพ</button>${editable ? ' (เลือกภาพใหม่เพื่อแทนที่)' : ''}</small>` : ''}</fieldset>
          <p class="form-error" data-form-error></p>
          ${editable ? `<div class="form-actions"><button type="submit" class="primary-button"><i class="fa-solid fa-floppy-disk"></i> ${data.record ? 'บันทึกการแก้ไข' : 'บันทึกโฮมรูม'}</button></div>` : ''}
          ${data.record && App.openReviewSubmit ? `<div class="form-actions" style="justify-content:flex-start"><button type="button" class="secondary-button" data-send-review><i class="fa-solid fa-paper-plane"></i> ส่งผู้บริหารลงนาม</button></div>` : ''}
          ${data.record ? `<p class="muted hr-meta">บันทึกล่าสุด ${esc(App.fmtDateTime(record.updatedAt))}${record.teacherId ? ' โดย ' + esc(App.personName(record.teacherId)) : ''}</p>` : ''}
        </form></section></div>`;
    bindDay(data);
  }

  function bindDay(data) {
    const ui = hrState();
    const body = document.getElementById('hr-body');
    const form = body.querySelector('form');
    body.querySelectorAll('[data-day]').forEach((button) => button.addEventListener('click', () => { ui.date = button.dataset.day; loadDay(); }));
    body.querySelectorAll('[data-shift]').forEach((button) => button.addEventListener('click', () => {
      const [year, month] = ui.date.split('-').map(Number);
      const first = new Date(year, month - 1 + Number(button.dataset.shift), 1);
      const iso = `${first.getFullYear()}-${String(first.getMonth() + 1).padStart(2, '0')}-01`;
      ui.date = iso > App.todayIso() ? App.todayIso() : iso;
      loadDay();
    }));
    const photo = body.querySelector('[data-photo]');
    if (photo) photo.addEventListener('click', () => App.openFile(data.record.photoFileId));
    const sendReview = document.querySelector('[data-send-review]');
    if (sendReview) sendReview.addEventListener('click', () => App.openReviewSubmit('homeroom-logs', data.record));
    const topics = form.elements.topics;
    body.querySelectorAll('[data-topic]').forEach((chip) => {
      const line = '• ' + chip.dataset.topic;
      const sync = () => chip.classList.toggle('on', topics.value.split('\n').some((text) => text.trim() === line));
      sync();
      topics.addEventListener('input', sync);
      chip.addEventListener('click', () => {
        const lines = topics.value.split('\n');
        const at = lines.findIndex((text) => text.trim() === line);
        if (at >= 0) lines.splice(at, 1); else lines.splice(lines.filter((text) => text.startsWith('• ')).length, 0, line);
        topics.value = lines.join('\n').replace(/^\n+|\n+$/g, '');
        topics.dispatchEvent(new Event('input'));
      });
    });
    const counter = body.querySelector('[data-follow-count]');
    const countFollow = () => { const n = body.querySelectorAll('.hr-student input:checked').length; counter.textContent = n ? `(เลือก ${n} คน)` : ''; };
    body.querySelectorAll('.hr-student input').forEach((box) => box.addEventListener('change', countFollow));
    countFollow();
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      App.clearErrors(form);
      const errorBox = form.querySelector('[data-form-error]');
      errorBox.textContent = '';
      if (!topics.value.trim()) { App.showErrors(form, { fieldErrors: { topics: 'กรุณาระบุกิจกรรมหรือหัวข้อโฮมรูม' } }); topics.focus(); return; }
      const submit = form.querySelector('[type=submit]');
      submit.disabled = true;
      const record = data.record || {};
      let photoFileId = record.photoFileId || '';
      const file = form.elements.photo && form.elements.photo.files[0];
      if (file) {
        if (file.size > 8 * 1024 * 1024) { errorBox.textContent = 'ภาพต้องไม่เกิน 8 MB'; submit.disabled = false; return; }
        const upload = await App.call('file.upload', { entity: 'homeroom-logs', name: file.name, mimeType: file.type, base64: await App.fileToBase64(file) });
        if (!upload.ok) { submit.disabled = false; return; }
        photoFileId = upload.data.fileId;
      }
      const values = { academicYearId: data.room.academicYearId, logDate: ui.date, homeroomId: data.room.id, teacherId: record.teacherId || App.state.user.personnelId || '',
        topics: topics.value, studentIssues: form.elements.studentIssues.value, followNote: form.elements.followNote.value, photoFileId,
        followStudentIds: Array.from(body.querySelectorAll('.hr-student input:checked')).map((box) => box.value).join(',') };
      COUNTS.forEach(([key]) => { values[key] = form.elements[key].value; });
      const response = await App.call('entity.save', { entity: 'homeroom-logs', id: data.record && data.record.id, version: data.record && data.record.version, values }, { quiet: true });
      submit.disabled = false;
      if (!response.ok) {
        App.showErrors(form, response.error);
        const fields = response.error.fieldErrors || {};
        errorBox.textContent = [response.error.message].concat(Object.values(fields).filter((text) => typeof text === 'string')).join(' · ');
        return;
      }
      App.forget('entity:homeroom-logs:');
      App.toast('บันทึกโฮมรูมแล้ว', 'success');
      loadDay();
    });
  }

  async function printMonth(homeroomId, month) {
    if (!homeroomId) return;
    const room = App.lookupList('homerooms').find((item) => item.id === homeroomId) || {};
    const response = await App.call('entity.list', { entity: 'homeroom-logs', academicYearId: room.academicYearId || App.state.yearId });
    if (!response.ok) return;
    const rows = response.data.rows.filter((row) => row.homeroomId === homeroomId && String(row.logDate).slice(0, 7) === month)
      .sort((a, b) => String(a.logDate).localeCompare(String(b.logDate)));
    const [year, monthNo] = month.split('-').map(Number);
    const s = App.state.settings || {};
    const people = await signerNames(room.academicYearId || App.state.yearId);
    const names = (ids) => String(ids || '').split(',').filter(Boolean).map((id) => App.label('students', id)).join(', ');
    const sum = (key) => rows.reduce((total, row) => total + (Number(row[key]) || 0), 0);
    App.printHtml('รายงานโฮมรูม ' + (room.label || ''), `<h2 class="center">รายงานการจัดกิจกรรมโฮมรูม</h2>
      <p class="center">${esc(s.schoolName || '')} · ห้อง ${esc(room.label || '')} · เดือน${THAI_MONTHS[monthNo - 1]} ${year + 543}<br>
        ครูที่ปรึกษา ${esc(App.personName(room.advisorId) || '-')}${room.coAdvisorId ? ' · ' + esc(App.personName(room.coAdvisorId)) : ''} · บันทึก ${rows.length} วัน</p>
      <table><thead><tr><th style="width:11%">วันที่</th><th class="center" style="width:13%">มา/สาย/ลา/ขาด</th><th>กิจกรรม/หัวข้อ</th><th>เรื่องที่นักเรียนแจ้ง/ปัญหา</th>
        <th style="width:16%">นักเรียนที่ติดตาม</th><th>การดำเนินการ</th></tr></thead>
      <tbody>${rows.map((row) => `<tr><td>${esc(App.fmtDate(row.logDate))}</td><td class="center">${[row.present, row.late, row.leave, row.absent].map((value) => esc(value === '' ? '-' : value)).join('/')}</td>
        <td class="pre">${esc(row.topics)}</td><td class="pre">${esc(row.studentIssues || '-')}</td><td>${esc(names(row.followStudentIds) || '-')}</td><td class="pre">${esc(row.followNote || '-')}</td></tr>`).join('')
        || '<tr><td colspan="6" class="center">ยังไม่มีบันทึกในเดือนนี้</td></tr>'}</tbody>
      ${rows.length ? `<tfoot><tr><th>รวม</th><th class="center">${sum('present')}/${sum('late')}/${sum('leave')}/${sum('absent')}</th><th colspan="4"></th></tr></tfoot>` : ''}</table>
      ${signBlock([['ครูที่ปรึกษา', App.personName(room.advisorId)], ['หัวหน้างานกิจการนักเรียน', people['หัวหน้างานกิจการนักเรียน']],
        ['ผู้อำนวยการโรงเรียน', people['ผู้อำนวยการโรงเรียน'] || s.directorName]])}`);
  }
})();
</script>
