<style>
  :root {
    --primary:#1e3a5f; --primary-soft:#e8eef7;
    --nav-bg:#0f1b33; --nav-text:#cbd5e1; --nav-muted:#8a97b0;
    --nav-bg-2:color-mix(in srgb,var(--nav-bg) 90%,#fff); --nav-line:color-mix(in srgb,var(--nav-bg) 86%,#fff);
    --nav-chip:color-mix(in srgb,var(--nav-bg) 82%,#fff); --nav-active:color-mix(in srgb,var(--nav-bg) 68%,var(--primary));
    --nav-group:color-mix(in srgb,var(--nav-bg) 94%,#fff);
    --slate-950:#0f172a; --slate-700:#334155; --slate-500:#64748b; --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9;
    --surface:#fff; --page:#f4f6fa; --danger:#be123c; --success:#15803d; --warning:#b45309;
    --radius:14px; --shadow:0 4px 18px rgba(15,23,42,.06);
    --c-sky:#38bdf8; --c-violet:#a78bfa; --c-green:#4ade80; --c-pink:#f472b6; --c-rose:#fb7185; --c-teal:#2dd4bf;
    --c-cyan:#22d3ee; --c-blue:#60a5fa; --c-amber:#fbbf24; --c-orange:#fb923c; --c-lime:#a3e635; --c-slate:#94a3b8;
  }
  *,*::before,*::after { box-sizing:border-box; }
  html { font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif; color:var(--slate-950); background:var(--page); font-size:15px; }
  body { margin:0; min-height:100vh; }
  button,input,textarea,select { font:inherit; color:inherit; }
  button,a { -webkit-tap-highlight-color:transparent; }
  a { color:var(--primary); }
  .hidden { display:none !important; }
  .muted { color:var(--slate-500); }
  h1,h2,h3 { line-height:1.3; }

  /* ---------- ฟอร์มและปุ่ม ---------- */
  label { display:grid; gap:6px; font-weight:600; font-size:.93rem; }
  input,select,textarea { width:100%; min-height:42px; border:1px solid var(--slate-200); border-radius:10px; padding:8px 12px; background:#fff; }
  input:focus,select:focus,textarea:focus { outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent); border-color:var(--primary); }
  input[type=checkbox],input[type=radio] { width:18px; height:18px; min-height:auto; accent-color:var(--primary); }
  input[type=color] { padding:4px; }
  textarea { min-height:90px; resize:vertical; }
  .primary-button,.secondary-button,.danger-button,.ghost-button { min-height:42px; border:0; border-radius:10px; padding:9px 16px; font-weight:600;
    cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
  .primary-button { color:#fff; background:var(--primary); }
  .primary-button:hover { filter:brightness(1.1); }
  .secondary-button { color:var(--slate-700); background:#fff; border:1px solid var(--slate-200); }
  .secondary-button:hover { background:var(--slate-100); }
  .danger-button { color:#fff; background:var(--danger); }
  .ghost-button { background:transparent; color:var(--primary); padding:6px 10px; min-height:34px; }
  .ghost-button.danger { color:var(--danger); }
  .block { width:100%; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .field-error,.form-error { min-height:16px; color:var(--danger); font-size:.83rem; font-weight:500; white-space:pre-line; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }
  .form-grid .wide { grid-column:1/-1; }
  .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .check-row { display:flex; align-items:center; gap:10px; font-weight:600; min-height:42px; }
  .icon-button { width:40px; height:40px; border:1px solid var(--slate-200); border-radius:10px; background:#fff; cursor:pointer; display:inline-grid; place-items:center; color:var(--slate-700); }
  .icon-button.danger-ghost { color:var(--danger); border-color:#fecdd3; }

  /* ---------- หน้าเข้าสู่ระบบ ---------- */
  .login-view { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; background:color-mix(in srgb,var(--nav-bg) 55%,var(--primary)); }
  .panel-head .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .login-brand { text-align:center; color:#fff; margin-bottom:26px; }
  .login-brand h1 { margin:14px 0 2px; font-size:2rem; }
  .login-brand p { margin:0; opacity:.85; }
  .school-mark,.brand-mark { width:110px; height:110px; margin:0 auto; border-radius:50%; display:grid; place-items:center; font-size:2.6rem;
    font-weight:700; color:var(--primary); background:#fff center/contain no-repeat; }
  .login-card { width:min(100%,460px); background:#fff; border-radius:18px; padding:30px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .login-card h2 { text-align:center; margin:0 0 20px; font-size:1.6rem; }
  .login-card form > label { margin-top:10px; }
  .input-icon { position:relative; }
  .input-icon > i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--slate-500); }
  .input-icon input { padding-left:40px; min-height:48px; }
  .input-icon .reveal { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--slate-500); cursor:pointer; padding:8px; }
  .login-card .primary-button { min-height:50px; margin-top:6px; font-size:1.05rem; }
  .login-card .secondary-button { margin-top:8px; }
  .login-footer { color:#fff; opacity:.75; margin-top:22px; font-size:.9rem; text-align:center; }

  /* ---------- โครงแอป ---------- */
  .app-shell { display:grid; grid-template-columns:290px 1fr; min-height:100vh; }
  .app-shell.collapsed { grid-template-columns:0 1fr; }
  .app-shell.collapsed .sidebar { visibility:hidden; }
  .sidebar { position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--nav-bg); color:var(--nav-text); display:flex; flex-direction:column; z-index:20; scrollbar-width:thin; scrollbar-color:var(--nav-chip) transparent; }
  .brand-block { padding:22px 18px 18px; text-align:center; border-bottom:1px solid var(--nav-line); }
  .brand-block .brand-mark { width:74px; height:74px; font-size:1.8rem; }
  .brand-block strong { display:block; margin-top:10px; color:#fff; font-size:1.2rem; }
  .brand-block small { color:var(--nav-muted); }
  .sidebar-user { display:flex; gap:12px; align-items:center; padding:16px 18px; border-bottom:1px solid var(--nav-line); }
  .sidebar-user strong { color:#fbbf24; display:block; }
  .avatar { width:44px; height:44px; flex:none; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; background:var(--nav-active); }
  .role-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .role-chip { font-size:.72rem; padding:1px 8px; border-radius:6px; background:#9f1239; color:#fff; }
  #sidebar-navigation { padding:10px 10px 16px; flex:1; }
  .nav-link { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; color:var(--nav-text); text-decoration:none; font-weight:600; }
  .nav-link:hover { background:var(--nav-bg-2); color:#fff; }
  .nav-link.active { background:var(--nav-active); color:#fff; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 60%,#fff); }
  .nav-link i { width:20px; text-align:center; }
  .nav-count { margin-left:auto; min-width:26px; padding:1px 8px; border-radius:99px; background:var(--nav-chip); color:var(--nav-text); font-size:.75rem; text-align:center; }
  .nav-section-title { margin:18px 12px 8px; color:var(--nav-muted); font-size:.78rem; }
  .nav-group { margin:4px 0; border-radius:12px; }
  .nav-group.open { background:var(--nav-group); }
  .nav-group-head { width:100%; display:flex; align-items:center; gap:12px; padding:10px 10px; border:0; background:none; color:#fff; font-weight:700; cursor:pointer; border-radius:12px; text-align:left; }
  .nav-group-head:hover { background:var(--nav-bg-2); }
  .nav-group-head .box { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:var(--nav-chip); color:#e2e8f0; flex:none; }
  .nav-group-head .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-group-head .chev { color:var(--nav-muted); transition:transform .15s; }
  .nav-group.open .chev { transform:rotate(180deg); }
  .nav-group-items { display:none; margin:2px 0 6px 26px; padding-left:10px; border-left:1px solid var(--nav-line); }
  .nav-group.open .nav-group-items { display:block; }
  .nav-group-items .nav-link { padding:9px 10px; font-weight:500; }
  .sidebar-action { margin:10px; padding:14px; border:0; border-top:1px solid var(--nav-line); background:none; color:var(--nav-text); text-align:left; cursor:pointer; font-weight:600; display:flex; gap:10px; align-items:center; }
  .sidebar-action:hover { color:#fff; }
  .c-sky{color:var(--c-sky)}.c-violet{color:var(--c-violet)}.c-green{color:var(--c-green)}.c-pink{color:var(--c-pink)}.c-rose{color:var(--c-rose)}
  .c-teal{color:var(--c-teal)}.c-cyan{color:var(--c-cyan)}.c-blue{color:var(--c-blue)}.c-amber{color:var(--c-amber)}.c-orange{color:var(--c-orange)}
  .c-lime{color:var(--c-lime)}.c-slate{color:var(--c-slate)}

  .workspace { min-width:0; display:flex; flex-direction:column; }
  .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--slate-200); }
  .topbar .icon-button#menu-button { border:0; font-size:1.2rem; }
  .topbar-title { flex:1; min-width:0; }
  .topbar h1 { margin:0; font-size:1.35rem; }
  .topbar p { margin:0; color:var(--slate-500); font-size:.88rem; }
  .user-chip { display:flex; align-items:center; gap:10px; }
  .user-chip strong { display:block; font-size:.95rem; }
  .user-chip small { color:var(--slate-500); }
  .page-content { padding:24px; flex:1; }
  .app-footer { padding:14px 24px; color:var(--slate-500); font-size:.85rem; text-align:center; }
  /* ใบลา A4 (สร้าง PDF นอกจอ) */
  .leave-capture { position:fixed; left:-10000px; top:0; }
  .leave-form { width:794px; height:1123px; padding:64px 76px 56px 113px; background:#fff; color:#111; font:17px/1.55 'Sarabun',Tahoma,sans-serif; overflow:hidden; }
  .leave-form h3 { text-align:center; font-size:1.25em; margin:0 0 14px; }
  .leave-form p { margin:0 0 4px; } .leave-form .lf-right { margin-left:52%; } .leave-form .lf-indent { text-indent:64px; }
  .leave-form .lf-box { display:inline-block; position:relative; width:15px; height:15px; border:1.5px solid #222; vertical-align:-2px; }
  .leave-form .lf-box.on::after { content:''; position:absolute; left:4px; top:0; width:4px; height:9px; border:solid #111; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .leave-form .lf-sign { margin:14px 0 0 45%; text-align:center; }
  .leave-form .lf-sig { display:flex; align-items:flex-end; justify-content:center; gap:6px; min-height:56px; }
  .leave-form .lf-sig img { max-height:56px; max-width:200px; } .leave-form .lf-line { display:inline-block; width:180px; border-bottom:1px dotted #555; height:36px; }
  .leave-form .lf-bottom { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:18px; padding-top:12px; border-top:1px solid #999; font-size:.92em; }
  .leave-form .lf-head { font-weight:700; margin-top:6px; } .leave-form .lf-center { text-align:center; } .leave-form .lf-small { margin-top:10px; line-height:1.7; }
  .leave-form table { width:100%; border-collapse:collapse; font-size:.92em; } .leave-form th, .leave-form td { border:1px solid #555; padding:2px 6px; text-align:center; font-weight:400; }
  .notify-events { border:1px solid var(--slate-200); border-radius:12px; padding:14px; display:grid; gap:12px; }
  .notify-cat { border-top:1px solid var(--slate-200); padding-top:10px; display:grid; gap:6px; }
  .notify-cat h4 { margin:0; font-size:.95rem; }
  .notify-route { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  @media (max-width: 640px) { .notify-route { grid-template-columns:1fr; } }
  .dev-credit { margin:6px auto 0; max-width:900px; padding:0 16px; font-size:.8rem; line-height:1.5; text-align:center; color:var(--slate-500); }
  .site-footer .dev-credit { color:var(--lp-footer-text,#fff); opacity:.7; }
  .dev-credit.login { margin-top:14px; padding:0; font-size:.74rem; }
  .dev-credit.app { margin:-6px auto 14px; }

  /* ---------- การ์ด แผง ตาราง ---------- */
  .panel { background:var(--surface); border:1px solid #e5e9f0; border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:18px; }
  .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .panel-head h2 { margin:0; font-size:1.15rem; }
  .panel-head p { margin:2px 0 0; color:var(--slate-500); font-size:.88rem; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:14px; }
  .toolbar label { min-width:160px; font-size:.85rem; }
  .toolbar .grow { flex:1 1 220px; }
  .toolbar .actions { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .table-wrap { overflow-x:auto; border:1px solid #e5e9f0; border-radius:12px; }
  .data-table { width:100%; border-collapse:collapse; font-size:.92rem; background:#fff; }
  .data-table th,.data-table td { padding:10px 12px; border-bottom:1px solid #eef1f5; text-align:left; vertical-align:middle; }
  .data-table th { color:var(--slate-700); background:#f7f9fc; font-weight:700; white-space:nowrap; position:sticky; top:0; }
  .data-table tbody tr:hover { background:#fafbfd; }
  .data-table .num { width:52px; color:var(--slate-500); text-align:center; }
  .data-table .center { text-align:center; }
  .data-table .right { text-align:right; }
  .data-table .actions { text-align:right; white-space:nowrap; }
  .data-table input,.data-table select { min-height:36px; padding:5px 8px; }
  .data-table input.score { width:80px; text-align:center; }
  .empty-row { text-align:center !important; color:var(--slate-500); padding:30px !important; }
  .pager { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; color:var(--slate-500); font-size:.88rem; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.78rem; font-weight:600; background:var(--slate-100); color:var(--slate-700); }
  .badge.success { background:#dcfce7; color:#166534; } .badge.warning { background:#fef3c7; color:#92400e; }
  .badge.danger { background:#ffe4e6; color:#9f1239; } .badge.info { background:#e0f2fe; color:#075985; }
  .empty-state { text-align:center; padding:48px 20px; }
  .empty-state .empty-icon { font-size:2.4rem; color:var(--slate-500); }

  /* ---------- แดชบอร์ด ---------- */
  .dash-actions { display:flex; justify-content:flex-end; margin-bottom:16px; }
  .sos-card { display:flex; align-items:center; gap:20px; justify-content:space-between; padding:28px; border-radius:18px; border:1px solid #fecdd3;
    background:linear-gradient(100deg,#fff1f2,#fff 55%,#fffbeb); margin-bottom:22px; }
  .sos-card .eyebrow { color:var(--danger); font-weight:700; margin:0 0 6px; }
  .sos-card h2 { margin:0 0 6px; font-size:1.5rem; }
  .sos-card p { margin:0 0 12px; color:var(--slate-700); }
  .sos-note { display:inline-block; padding:6px 14px; border-radius:99px; background:#fef3c7; color:#92400e; font-size:.85rem; font-weight:600; }
  .sos-button { flex:none; width:170px; height:170px; border-radius:50%; border:8px solid #fecdd3; background:radial-gradient(circle at 40% 35%,#e11d48,#9f1239);
    color:#fff; cursor:pointer; display:grid; place-content:center; text-align:center; box-shadow:0 12px 30px rgba(190,18,60,.35); }
  .sos-button i { font-size:2.2rem; } .sos-button strong { font-size:1.9rem; line-height:1; margin-top:4px; } .sos-button small { font-weight:600; }
  .sos-alerts { margin-bottom:18px; }
  .sos-alert { display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:12px; background:#fff1f2; border:1px solid #fecdd3; margin-bottom:8px; }
  .sos-alert .grow { flex:1; }
  .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; margin-bottom:22px; }
  .stat-card { position:relative; padding:20px; border-radius:16px; background:#fff; border:2px solid; }
  .stat-card small { color:var(--slate-700); font-weight:600; font-size:.95rem; }
  .stat-card strong { display:block; font-size:2rem; margin:6px 0 10px; }
  .stat-card p { margin:0; color:var(--slate-500); font-size:.88rem; display:flex; gap:8px; align-items:center; }
  .stat-card .stat-icon { position:absolute; right:18px; top:18px; width:54px; height:54px; border-radius:14px; display:grid; place-items:center; font-size:1.4rem; }
  .stat-card.blue { border-color:#93c5fd; } .stat-card.blue .stat-icon { background:#dbeafe; color:#1d4ed8; } .stat-card.blue p i { color:#1d4ed8; }
  .stat-card.green { border-color:#86efac; } .stat-card.green .stat-icon { background:#dcfce7; color:#15803d; } .stat-card.green p i { color:#15803d; }
  .stat-card.amber { border-color:#fcd34d; } .stat-card.amber .stat-icon { background:#fef3c7; color:#d97706; } .stat-card.amber p i { color:#d97706; }
  .stat-card.purple { border-color:#d8b4fe; } .stat-card.purple .stat-icon { background:#f3e8ff; color:#9333ea; } .stat-card.purple p i { color:#9333ea; }
  .chart-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-bottom:22px; }
  .chart-card { background:#fff; border:1px solid #e5e9f0; border-radius:16px; padding:18px; }
  .chart-card header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .chart-card h3 { margin:0; font-size:1.05rem; } .chart-card header p { margin:0; color:var(--slate-500); font-size:.85rem; }
  .chart-tag { font-size:.72rem; font-weight:700; letter-spacing:.06em; padding:3px 10px; border-radius:99px; }
  .chart-tag.line { background:#e0f2fe; color:#0369a1; } .chart-tag.doughnut { background:#ffe4e6; color:#be123c; } .chart-tag.pie { background:#fef3c7; color:#b45309; }
  .chart-card svg { width:100%; height:auto; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; font-size:.85rem; margin-top:8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; } .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .announcement { padding:12px 0; border-bottom:1px solid #eef1f5; } .announcement:last-child { border-bottom:0; }
  .announcement h4 { margin:0 0 4px; } .announcement p { margin:0; color:var(--slate-500); font-size:.9rem; white-space:pre-line; }

  /* ---------- ศูนย์รวมแอป ---------- */
  .app-group { margin-bottom:22px; }
  .app-group h2 { font-size:1.05rem; margin:0 0 12px; display:flex; gap:10px; align-items:center; }
  .app-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .app-card { display:flex; gap:12px; align-items:center; padding:16px; border-radius:14px; background:#fff; border:1px solid #e5e9f0; text-decoration:none; color:inherit; transition:transform .12s,box-shadow .12s; }
  .app-card:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(15,23,42,.08); }
  .app-card .app-icon { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--nav-bg); font-size:1.15rem; flex:none; }
  .app-card strong { font-size:.95rem; }

  /* ---------- เช็กชื่อ ---------- */
  .status-group { display:inline-flex; gap:4px; }
  .status-group button { min-width:44px; height:36px; border:1px solid var(--slate-200); border-radius:8px; background:#fff; cursor:pointer; font-weight:600; }
  .status-group button.on[data-s=P] { background:#16a34a; border-color:#16a34a; color:#fff; }
  .status-group button.on[data-s=L] { background:#d97706; border-color:#d97706; color:#fff; }
  .status-group button.on[data-s=E] { background:#2563eb; border-color:#2563eb; color:#fff; }
  .status-group button.on[data-s=A] { background:#dc2626; border-color:#dc2626; color:#fff; }
  .summary-strip { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
  .summary-strip span { padding:6px 14px; border-radius:99px; background:var(--slate-100); font-weight:600; font-size:.9rem; }
  .register-table td,.register-table th { padding:6px 6px; text-align:center; font-size:.82rem; }
  .register-table td:nth-child(2),.register-table th:nth-child(2) { text-align:left; white-space:nowrap; }
  .s-P { color:#16a34a; } .s-L { color:#d97706; font-weight:700; } .s-E { color:#2563eb; font-weight:700; } .s-A { color:#dc2626; font-weight:700; }

  /* ---------- modal toast loading ---------- */
  .modal { width:min(760px,calc(100vw - 24px)); max-height:calc(100vh - 40px); border:0; border-radius:16px; padding:0; box-shadow:0 30px 70px rgba(15,23,42,.35); }
  .modal::backdrop { background:rgba(15,23,42,.5); }

  /* ---------- บันทึกหลังการสอน: กล่องให้น้องวิชาการวิเคราะห์ (สีม่วงของน้องวิชาการ) ---------- */

  .map-filter small { font-weight:500; color:var(--slate-500); }

  /* ---------- ภาพรวมการดูแล / สัญญาณเตือนรายคน (สีเขียวหัวเป็ดของน้องใส่ใจ) ---------- */

  /* ---------- บันทึกโฮมรูม ---------- */
  .hr-layout { display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; align-items:start; }

  .hr-dow { text-align:center; font-size:.75rem; font-weight:700; color:var(--slate-500); padding-bottom:2px; }
  .hr-day { aspect-ratio:1; max-width:100%; border:1px solid var(--slate-200); border-radius:9px; background:#fff; font-weight:600; font-size:.88rem;
    cursor:pointer; color:var(--slate-700); position:relative; font-variant-numeric:tabular-nums; }
  .hr-day.blank { border:0; background:transparent; cursor:default; }

  .hr-progress strong { font-size:1.3rem; color:var(--success); font-variant-numeric:tabular-nums; }
  .hr-bar { height:8px; border-radius:99px; background:var(--slate-100); overflow:hidden; }
  .hr-bar span { display:block; height:100%; background:var(--success); border-radius:99px; }
  .hr-key { display:inline-block; width:10px; height:10px; border-radius:3px; margin-left:6px; vertical-align:-1px; }

  .hr-counts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .hr-count { --c:#16a34a; gap:4px; padding:8px 10px; border-radius:12px; border:1px solid color-mix(in srgb,var(--c) 30%,#fff);

  .hr-count.late { --c:#d97706; } .hr-count.leave { --c:#2563eb; } .hr-count.absent { --c:#dc2626; }

  .hr-chips { display:flex; flex-wrap:wrap; gap:6px; }

  .hr-chip.on { background:#fef3c7; border-color:#fcd34d; color:#92400e; font-weight:600; }

  .hr-students { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px; max-height:280px; overflow:auto; padding:2px; }
  .hr-student { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--slate-200); border-radius:10px; font-weight:500;

  }
  @media (max-width: 520px) {
    .hr-counts { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .hr-students { grid-template-columns:1fr; }
  }
