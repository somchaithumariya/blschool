  <div id="loading-overlay" class="loading-overlay hidden" role="status" aria-live="polite">
    <div class="spinner"></div><span>กำลังประมวลผล</span>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <!-- หน้าแรกของโรงเรียน -->
  <main id="login-view" class="site">
    <header class="site-nav">
      <button type="button" class="site-brand" data-scroll="home"><span class="school-mark small">ร</span>
        <span><strong id="site-brand-name">ระบบบริหารจัดการโรงเรียน</strong><small id="site-brand-sub" class="hidden"></small></span></button>
      <nav id="site-links" class="site-links" aria-label="เมนูหน้าแรก"></nav>
      <button type="button" id="site-menu-toggle" class="icon-button site-menu-toggle" aria-label="เปิดเมนู" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
      <button type="button" class="primary-button site-login" data-open-login><i class="fa-solid fa-right-to-bracket"></i> <span data-tk="siteLogin">เข้าสู่ระบบ</span></button>
    </header>
    <div id="site-ticker" class="site-ticker hidden" aria-label="กิจกรรมประจำเดือน"></div>
    <section id="site-hero" class="site-hero" data-edit-image="slide" aria-roledescription="carousel" aria-label="ภาพกิจกรรมโรงเรียน">
      <div id="hero-slides" class="hero-slides"></div>
      <div class="hero-inner">
        <div class="login-brand hero-text">
          <div id="login-logo" class="school-mark" data-edit-image="logo">ร</div>
          <span id="hero-kicker" class="hero-kicker hidden" data-edit="schoolAffiliation"></span>
          <h1 id="login-title" data-edit="schoolName">ระบบบริหารจัดการโรงเรียน</h1>
          <p id="hero-name-en" class="hero-name-en hidden" data-edit="schoolNameEn"></p>
          <p id="login-description" data-edit="schoolDescription">ระบบบริหารจัดการโรงเรียน</p>
          <p id="hero-motto" class="hero-motto hidden" data-edit="schoolMotto"></p>
          <div class="hero-actions">
            <button type="button" class="hero-ghost" data-scroll="basic" data-edit="title:hero:button"><i class="fa-solid fa-school"></i> <span>รู้จักโรงเรียน</span></button>
          </div>
        </div>
      </div>
      <p id="hero-caption" class="hero-caption hidden"></p>
      <div id="hero-controls" class="hero-controls"></div>
    </section>
    <div id="site-sections"></div>
    <footer class="site-footer"><p id="login-footer" class="login-footer" data-edit="footerText"></p><p class="dev-credit" data-credit></p></footer>
    <div id="customizer-root"></div>
  </main>
  <button id="preview-exit" type="button" class="primary-button preview-exit hidden"><i class="fa-solid fa-arrow-left"></i> กลับไปหน้าจัดการ</button>

  <!-- หน้าต่างเข้าสู่ระบบ -->
  <dialog id="login-dialog" class="modal login-dialog" aria-labelledby="login-card-title">
    <button type="button" class="icon-button login-close" data-close-login aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button>
    <section id="login-card" class="login-card">
      <div class="login-dialog-mark school-mark">ร</div>
      <h2 id="login-card-title" data-tk="loginTitle">เข้าสู่ระบบ</h2>
      <p id="login-app-note" class="login-app-note hidden" data-tk="loginAppNote">ลงชื่อเข้าใช้ด้วยบัญชีที่โรงเรียนออกให้</p>
      <form id="login-form" novalidate>
        <label for="username">ชื่อผู้ใช้งาน</label>
        <div class="input-icon"><i class="fa-regular fa-user"></i><input id="username" name="username" autocomplete="username" placeholder="กรอกชื่อผู้ใช้งาน" required></div>
        <small class="field-error" data-error-for="username"></small>
        <label for="password">รหัสผ่าน</label>
        <div class="input-icon"><i class="fa-solid fa-lock"></i><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="reveal" data-reveal="password" aria-label="แสดงหรือซ่อนรหัสผ่าน"><i class="fa-regular fa-eye"></i></button></div>
        <small class="field-error" data-error-for="password"></small>
        <label class="check-row remember-row"><input type="checkbox" name="remember" id="remember-login"> <span data-tk="rememberLogin">จดจำการเข้าสู่ระบบบนเครื่องนี้ (14 วัน)</span></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="primary-button block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
      </form>
      <p id="register-link" class="login-links hidden">ยังไม่มีบัญชี? <button type="button" id="register-button">สมัครสมาชิก</button></p>
      <p class="dev-credit login" data-credit></p>
    </section>
  </dialog>

  <!-- บังคับเปลี่ยนรหัสผ่าน -->
  <main id="forced-password-view" class="login-view hidden">
    <section class="login-card" aria-labelledby="forced-password-title">
      <h2 id="forced-password-title" data-tk="forcedTitle">เปลี่ยนรหัสผ่านก่อนใช้งาน</h2>
      <p class="muted" data-tk="forcedNote">บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณากำหนดรหัสผ่านใหม่</p>
      <form id="forced-password-form" novalidate>
        <label>รหัสผ่านปัจจุบัน<input name="currentPassword" type="password" autocomplete="current-password" required></label>
        <label>รหัสผ่านใหม่<input name="newPassword" type="password" autocomplete="new-password" required></label>
        <p id="forced-password-error" class="form-error" role="alert"></p>
        <button class="primary-button block" type="submit">เปลี่ยนรหัสผ่านและเข้าสู่ระบบ</button>
        <button id="forced-logout-button" class="secondary-button block" type="button">ออกจากระบบ</button>
      </form>
    </section>
  </main>

  <!-- แอปหลัก -->
  <div id="app-shell" class="app-shell hidden">
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <aside id="sidebar" class="sidebar" aria-label="เมนูหลัก">

      <button id="logout-button" class="sidebar-action" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span data-tk="logout">ออกจากระบบ</span></button>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="icon-button" type="button" aria-label="เปิด/ปิดเมนู"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title"><h1 id="page-title">แดชบอร์ด</h1><p id="page-subtitle"></p></div>

          <span id="user-avatar" class="avatar">ผ</span>
          <div><strong id="user-name"></strong><small id="user-role"></small></div>
        </div>
      </header>
      <p id="page-note" class="page-note hidden"></p>
      <main id="page-content" class="page-content" tabindex="-1"></main>
      <footer id="app-footer" class="app-footer"></footer>
      <p class="dev-credit app" data-credit></p>
    </div>
    <nav id="bottom-nav" class="bottom-nav" aria-label="เมนูลัด"></nav>
    <div id="bot-dock" class="bot-dock no-print hidden">
      <p id="bot-hello" class="bot-hello" role="status" hidden></p>
      <button id="bot-button" class="bot-fab" type="button" aria-expanded="false" aria-controls="bot-panel"><span class="bot-fab-face" data-face></span><span class="bot-fab-name" data-name></span></button>
