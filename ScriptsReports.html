<script>
/**
 * รายงาน: สารสนเทศ, ผลงานและรางวัล, ข้อมูลพื้นฐานโรงเรียน/ครู, รายงาน SAR
 */
(function () {
  'use strict';
  const App = window.App;
  const { esc, attr } = App;

  function yearBar(extra) {
    return `<section class="panel no-print"><div class="toolbar"><label>ปีการศึกษา<select data-year>${App.yearOptions()}</select></label>${extra || ''}
      <div class="actions"><button type="button" class="secondary-button" onclick="window.print()"><i class="fa-solid fa-print"></i> พิมพ์</button></div></div></section>`;
  }
  function bindYear() {
    document.querySelector('[data-year]').addEventListener('change', (event) => { App.state.yearId = event.target.value; App.route(); });
  }
  async function load(action, data) {
    const key = 'report:' + action + ':' + JSON.stringify(data || {});
    if (App.cached(key)) return App.cached(key);
    const response = await App.call(action, data);
    return response.ok ? App.remember(key, response.data) : null;
  }
  function pct(part, total) { return total ? Math.round(part * 1000 / total) / 10 + '%' : '-'; }
  function countTable(title, counts) {
    const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
    return `<div><h3>${esc(title)}</h3>${App.simpleTable(['รายการ', 'จำนวน'], entries.map(([name, value]) => [name, value]))}</div>`;
  }

  // ---------- รายงานสารสนเทศ ----------
  App.register('#/information-report', async () => {
    const data = await load('report.information', { academicYearId: App.state.yearId });
    if (!data) return;
    const totals = data.rows.reduce((sum, row) => { ['students', 'info', 'visits', 'sdq', 'risk', 'problem'].forEach((key) => { sum[key] += row[key]; }); return sum; },
      { students: 0, info: 0, visits: 0, sdq: 0, risk: 0, problem: 0 });
    App.content(yearBar() + `<section class="panel print-sheet"><h2>รายงานความครบถ้วนของสารสนเทศนักเรียน</h2>
      <p class="meta"><span>ปีการศึกษา ${esc(App.label('academicYears', App.state.yearId))}</span><span>นักเรียน ${App.num(totals.students)} คน</span></p>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>ห้อง</th><th class="center">นักเรียน</th><th class="center">สารสนเทศรายบุคคล</th>
        <th class="center">เยี่ยมบ้าน</th><th class="center">SDQ</th><th class="center">กลุ่มเสี่ยง</th><th class="center">กลุ่มมีปัญหา</th></tr></thead>
        <tbody>${data.rows.map((row) => `<tr><td>${esc(row.label)}</td><td class="center">${row.students}</td>
          <td class="center">${row.info} (${pct(row.info, row.students)})</td><td class="center">${row.visits} (${pct(row.visits, row.students)})</td>
          <td class="center">${row.sdq} (${pct(row.sdq, row.students)})</td><td class="center">${row.risk}</td><td class="center">${row.problem}</td></tr>`).join('')
          || '<tr><td colspan="7" class="empty-row">ยังไม่มีห้องเรียนในปีการศึกษานี้</td></tr>'}</tbody>
        <tfoot><tr><th>รวม</th><th class="center">${totals.students}</th><th class="center">${totals.info} (${pct(totals.info, totals.students)})</th>
          <th class="center">${totals.visits} (${pct(totals.visits, totals.students)})</th><th class="center">${totals.sdq} (${pct(totals.sdq, totals.students)})</th>
          <th class="center">${totals.risk}</th><th class="center">${totals.problem}</th></tr></tfoot></table></div></section>`);
    bindYear();
  });

  // ---------- รายงานผลงานและรางวัล ----------
  App.register('#/awards-report', async () => {
    const data = await load('report.awards', { academicYearId: App.state.yearId });
    if (!data) return;
    const levels = ['โรงเรียน', 'เขตพื้นที่', 'จังหวัด', 'ภาค', 'ประเทศ', 'นานาชาติ', 'ไม่ระบุ'];
    const types = Object.keys(data.matrix);
    App.content(yearBar() + `<section class="panel print-sheet"><h2>รายงานผลงานและรางวัล</h2>
      <p class="meta"><span>ปีการศึกษา ${esc(App.label('academicYears', App.state.yearId))}</span><span>ทั้งหมด ${App.num(data.total)} รายการ</span></p>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>ประเภท</th>${levels.map((level) => `<th class="center">${level}</th>`).join('')}<th class="center">รวม</th></tr></thead>
        <tbody>${types.map((type) => `<tr><td>${esc(type)}</td>${levels.map((level) => `<td class="center">${data.matrix[type][level] || ''}</td>`).join('')}
          <td class="center"><strong>${Object.values(data.matrix[type]).reduce((a, b) => a + b, 0)}</strong></td></tr>`).join('')
          || `<tr><td colspan="${levels.length + 2}" class="empty-row">ยังไม่มีข้อมูล</td></tr>`}</tbody></table></div>
      <h3 style="margin-top:20px">รายการผลงาน</h3>
      ${App.simpleTable(['วันที่', 'ประเภท', 'เจ้าของผลงาน', 'ผลงาน/รางวัล', 'ระดับ', 'ผลที่ได้'], data.rows.map((row) => [App.fmtDate(row.awardDate), row.ownerType,
        row.ownerType === 'นักเรียน' ? App.label('students', row.studentId) : row.ownerType === 'ครู' ? App.personName(row.personnelId) : App.state.settings.schoolName,
        row.title, row.level, row.rank]))}</section>`);
    bindYear();
  });

  // ---------- ข้อมูลพื้นฐานของโรงเรียน ----------
  App.register('#/school-basic', async () => {
    const data = await load('report.schoolBasic', { academicYearId: App.state.yearId });
    if (!data) return;
    const s = data.settings;
    const total = data.levels.reduce((sum, level) => sum + level.male + level.female, 0);
    App.content(yearBar() + `<section class="panel print-sheet"><h2>ข้อมูลพื้นฐานของโรงเรียน</h2><h3>${esc(s.schoolName || '')}</h3>
      <table class="data-table" style="margin:14px 0">
        <tr><th style="width:28%">สังกัด</th><td>${esc(s.schoolAffiliation || '-')}</td></tr>
        <tr><th>ที่อยู่</th><td>${esc(s.schoolAddress || '-')}</td></tr>
        <tr><th>โทรศัพท์</th><td>${esc(s.schoolPhone || '-')}</td></tr>
        <tr><th>ผู้อำนวยการ</th><td>${esc(s.directorName || '-')}</td></tr></table>
      ${App.can('settings.edit') ? '<p class="muted no-print">แก้ไขข้อมูลโรงเรียนได้ที่เมนู “ตั้งค่าระบบ”</p>' : ''}
      <h3>จำนวนนักเรียน ปีการศึกษา ${esc(App.label('academicYears', App.state.yearId))}</h3>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>ระดับชั้น</th><th class="center">ห้อง</th><th class="center">ชาย</th><th class="center">หญิง</th><th class="center">รวม</th></tr></thead>
        <tbody>${data.levels.map((level) => `<tr><td>${esc(level.gradeLevel)}</td><td class="center">${level.rooms}</td><td class="center">${level.male}</td>
          <td class="center">${level.female}</td><td class="center">${level.male + level.female}</td></tr>`).join('') || '<tr><td colspan="5" class="empty-row">ยังไม่มีข้อมูลนักเรียนรายปี</td></tr>'}</tbody>
        <tfoot><tr><th>รวม</th><th class="center">${data.levels.reduce((sum, level) => sum + level.rooms, 0)}</th>
          <th class="center">${data.levels.reduce((sum, level) => sum + level.male, 0)}</th><th class="center">${data.levels.reduce((sum, level) => sum + level.female, 0)}</th>
          <th class="center">${total}</th></tr></tfoot></table></div>
      <div style="margin-top:18px">${countTable('บุคลากรจำแนกตามประเภท (รวม ' + data.personnelTotal + ' คน)', data.personnelByType)}</div></section>`);
    bindYear();
  });

  // ---------- ข้อมูลพื้นฐานของครู ----------
  App.register('#/teacher-basic', async () => {
    const data = await load('report.teacherBasic', {});
    if (!data) return;
    App.content(`<section class="panel no-print"><div class="toolbar"><div class="actions"><button type="button" class="secondary-button" onclick="window.print()"><i class="fa-solid fa-print"></i> พิมพ์</button></div></div></section>
      <section class="panel print-sheet"><h2>ข้อมูลพื้นฐานของครูและบุคลากร</h2><p class="meta"><span>บุคลากรทั้งหมด ${App.num(data.total)} คน</span></p>
      <div class="form-grid">${countTable('จำแนกตามวิทยฐานะ', data.byStanding)}${countTable('จำแนกตามกลุ่มสาระฯ', data.bySubjectGroup)}
        ${countTable('จำแนกตามตำแหน่ง', data.byPosition)}${countTable('จำแนกตามประเภทบุคลากร', data.byType)}</div></section>`);
  });

  // ---------- รายงาน SAR ----------
  App.register('#/sar-report', async () => {
    const data = await load('report.sar', { academicYearId: App.state.yearId });
    if (!data) return;
    const s = data.basic.settings;
    const students = data.basic.levels.reduce((sum, level) => sum + level.male + level.female, 0);
    App.content(yearBar() + `<section class="panel print-sheet">
      <h2>รายงานการประเมินตนเองของสถานศึกษา (SAR)</h2><h3>${esc(s.schoolName || '')}</h3>
      <p class="meta"><span>ปีการศึกษา ${esc(App.label('academicYears', App.state.yearId))}</span><span>${esc(s.schoolAffiliation || '')}</span></p>
      <h3 style="text-align:left">ส่วนที่ 1 ข้อมูลพื้นฐาน</h3>
      <p>นักเรียน ${App.num(students)} คน · ห้องเรียน ${App.num(data.basic.levels.reduce((sum, level) => sum + level.rooms, 0))} ห้อง · บุคลากร ${App.num(data.basic.personnelTotal)} คน</p>
      ${data.sections.map((section) => `<h3 style="text-align:left">${esc(section.sectionNo)}. ${esc(section.title)}</h3><p style="white-space:pre-line">${esc(section.content)}</p>`).join('')
        || '<p class="muted">ยังไม่มีเนื้อหา เพิ่มได้ที่เมนู “เนื้อหารายงาน SAR”</p>'}
      <h3 style="text-align:left">ผลการประเมินตามมาตรฐาน</h3>
      ${App.simpleTable(['มาตรฐาน', 'ประเด็นพิจารณา', 'ค่าเป้าหมาย', 'ผลการดำเนินงาน', 'ระดับคุณภาพ'],
        data.indicators.map((row) => [row.standard, row.indicator, row.target, row.result, row.level]))}
      <h3 style="text-align:left">ผลงานและรางวัลจำแนกตามระดับ</h3>
      ${App.simpleTable(['ระดับ', 'จำนวน'], Object.entries(data.awards).map(([level, count]) => [level, count]))}
      <div class="signatures"><div></div><div>ลงชื่อ ...................................................<br>(${esc(s.directorName || '...................................................')})<br>ผู้อำนวยการ${esc(s.schoolName || '')}</div></div>
    </section>`);
    bindYear();
  });
})();
</script>
