<script>
/**
 * หน้าจอกลางของโมดูลแบบตาราง/ฟอร์ม (APP_CONFIG.ENTITIES)
 * มีตัวกรองปีการศึกษา ค้นหา เพิ่ม/แก้ไข/ลบ แนบไฟล์ นำเข้า-ส่งออก CSV และพิมพ์
 * หน้าเฉพาะทางเพิ่มปุ่มในแถวได้ผ่าน App.entityActions[key] และส่วนท้ายผ่าน App.entityAfter[key]
 */
(function () {
  'use strict';
  const App = window.App;
  const PAGE_SIZE = 50;
  const LOOKUP_ENTITIES = { personnel: 'personnel', students: 'students', homerooms: 'homerooms', projects: 'projects' };
  App.entityAfter = {};
  App.entityDefaults = {}; // ค่าเริ่มต้นของฟอร์มเพิ่มข้อมูล (เช่น ใบลา = ชื่อผู้ใช้เอง)
  App.entityBeforeSave = {}; // ทำงานก่อนบันทึก (เช่น สร้างใบลา PDF) คืน false = ยกเลิกการบันทึก
  App.entityOpen = {}; // หน้าต่างดูรายละเอียดเฉพาะเมนู (เช่น พิจารณาใบลา)
  App.entityFormReady = {}; // เพิ่มปุ่ม/ตัวช่วยในฟอร์มหลังสร้างเสร็จ (เช่น ปุ่มให้น้องวิชาการวิเคราะห์) รับ (form, row)
  App.pendingOpen = null; // เปิดรายการนี้เมื่อตารางโหลดเสร็จ (มาจากลิงก์ในการแจ้งเตือน)

  function ui(key) { return App.cached('ui:' + key) || App.remember('ui:' + key, { q: '', filters: {}, page: 1 }); }
  function dataKey(entity, yearId) { return 'entity:' + entity.key + ':' + (entity.yearScoped ? yearId : 'all'); }

  async function loadRows(entity, force) {
    const key = dataKey(entity, App.state.yearId);
    if (!force && App.cached(key)) return App.cached(key);
    const response = await App.call('entity.list', { entity: entity.key, academicYearId: entity.yearScoped ? App.state.yearId : '' });
    if (!response.ok) return null;
    return App.remember(key, response.data.rows);
  }

  // ตารางใหญ่: ขอเฉพาะหน้าที่แสดงจากเซิร์ฟเวอร์ (ตารางเล็กเซิร์ฟเวอร์ส่งทั้งหมดมาเลย)
  async function loadPage(entity, state) {
    // โหลดหน้าแรกแสดงตัวโหลดเต็มจอ ส่วนการค้นหา/เปลี่ยนหน้าในตารางเดิมโหลดเงียบ ๆ
    const quiet = !!document.querySelector('#page-content [data-entity-page="' + entity.key + '"]');
    const response = await App.call('entity.list', { entity: entity.key, academicYearId: entity.yearScoped ? App.state.yearId : '',
      page: state.page, pageSize: PAGE_SIZE, q: state.q, filters: state.filters }, { silent: quiet });
    if (!response.ok) return null;
    if (response.data.full) { App.remember(dataKey(entity, App.state.yearId), response.data.rows); return { full: true }; }
    return response.data;
  }

  // โหลดข้อมูลทั้งหมดเบื้องหลัง เสร็จแล้วแสดงใหม่ (ค้นหา/เปลี่ยนหน้าได้ทันทีโดยไม่ต้องรอเซิร์ฟเวอร์)
  const prefetching = {};
  const modules = {};
  let generation = 0; // เพิ่มทุกครั้งที่มีการบันทึก เพื่อทิ้งผลโหลดเบื้องหลังที่ตอบกลับมาช้ากว่าการบันทึก (ไม่งั้นข้อมูลเก่าจะทับข้อมูลใหม่)
  function prefetchAll(entity, module) {
    const key = dataKey(entity, App.state.yearId);
    if (prefetching[key] || App.cached(key)) return;
    prefetching[key] = true;
    const started = generation;
    App.request('entity.list', { entity: entity.key, academicYearId: entity.yearScoped ? App.state.yearId : '' }).then((response) => {
      delete prefetching[key];
      if (!response.ok || started !== generation) return;
      App.remember(key, response.data.rows);
      const modal = document.getElementById('modal');
      if (location.hash !== module.route || dataKey(entity, App.state.yearId) !== key || (modal && modal.open)) return;
      const active = document.activeElement;
      const typing = active && active.matches && active.matches('[data-search]');
      App.renderEntity(entity.key, module).then(() => {
        if (!typing) return;
        const input = document.querySelector('#page-content [data-search]');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      });
    });
  }

  function cellText(field, value) {
    if (value === '' || value === null || value === undefined) return '';
    if (field.multi) return String(value).split(',').filter(Boolean).map((id) => App.label(field.multi, id)).join(', ');
    switch (field.type) {
      case 'ref': return App.label(field.ref, value);
      case 'year': return App.label('academicYears', value);
      case 'date': return App.fmtDate(value);
      case 'checkbox': return value === true ? 'ใช่' : '';
      case 'number': return Number(value).toLocaleString('th-TH');
      default: return String(value);
    }
  }

  function cellHtml(field, row) {
    const value = row[field.key];
    if (field.type === 'file') return value ? `<button type="button" class="ghost-button" data-file="${App.attr(value)}"><i class="fa-solid fa-paperclip"></i> เปิด</button>` : '';
    if (field.type === 'checkbox') return value === true ? '<i class="fa-solid fa-check c-green"></i>' : '';
    if (field.key === 'result' || field.key === 'group' || field.key === 'status') return value ? `<span class="badge ${badgeTone(value)}">${App.esc(value)}</span>` : '';
    if (field.type === 'textarea') return App.esc(String(value || '').slice(0, 80)) + (String(value || '').length > 80 ? '…' : '');
    return App.esc(cellText(field, value));
  }

  function badgeTone(value) {
    if (/ไม่บรรลุ|ยกเลิก/.test(value)) return 'danger';
    if (/บางส่วน|เสนอโครงการ/.test(value)) return 'warning';
    if (/ปกติ|ดีเยี่ยม|ดีมาก|ยอดเยี่ยม|กำลังศึกษา|ปฏิบัติงาน|ยุติ|ดีเลิศ|บรรลุ|อนุมัติ|เสร็จสิ้น/.test(value)) return 'success';
    if (/เสี่ยง|พอใช้|ติดตาม|กำลัง/.test(value)) return 'warning';
    if (/มีปัญหา|ปรับปรุง|ย้าย|ลาออก|ส่งต่อ/.test(value)) return 'danger';
    return 'info';
  }

  function matches(entity, row, state) {
    for (const [field, value] of Object.entries(state.filters)) if (value && String(row[field]) !== String(value)) return false;
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return entity.fields.some((field) => String(cellText(field, row[field.key])).toLowerCase().includes(q));
  }

  App.renderEntity = async function renderEntity(key, module) {
    const entity = App.state.entities[key];
    modules[key] = module;
    const state = ui(key);
    const canEdit = App.can(entity.editPermission);
    let rows = App.cached(dataKey(entity, App.state.yearId));
    let serverPage = null;
    if (!rows) {
      serverPage = await loadPage(entity, state);
      if (!serverPage) return App.renderError({ message: 'ไม่สามารถโหลดข้อมูลได้' });
      if (serverPage.full) { serverPage = null; rows = App.cached(dataKey(entity, App.state.yearId)); }
      else { rows = serverPage.rows; prefetchAll(entity, module); }
    }
    const listFields = entity.fields.filter((field) => field.list);
    const filterFields = entity.fields.filter((field) => field.filter);
    const visible = serverPage ? rows : rows.filter((row) => matches(entity, row, state));
    const visibleCount = serverPage ? serverPage.total : visible.length;
    const allCount = serverPage ? serverPage.all : rows.length;
    const pageCount = Math.max(1, Math.ceil(visibleCount / PAGE_SIZE));
    state.page = serverPage ? serverPage.page : Math.min(state.page, pageCount);
    const pageRows = serverPage ? rows : visible.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
    const actions = App.entityActions[key] || [];

    const filters = filterFields.map((field) => {
      const current = state.filters[field.key] || '';
      const choices = field.type === 'ref'
        ? App.options(field.ref, current, { empty: 'ทั้งหมด', yearId: entity.yearScoped ? App.state.yearId : '' })
        : '<option value="">ทั้งหมด</option>' + field.options.map((option) => `<option ${option === current ? 'selected' : ''}>${App.esc(option)}</option>`).join('');
      return `<label>${App.esc(field.label)}<select data-filter="${App.attr(field.key)}">${choices}</select></label>`;
    }).join('');

    App.content(`<section class="panel" data-entity-page="${App.attr(key)}">
      <div class="panel-head"><div><h2><i class="fa-solid ${App.attr(module.icon)} c-${App.attr(module.color)}"></i> <span data-tkey="e:${App.attr(key)}">${App.esc(entity.label)}</span></h2>
        <p>ทั้งหมด ${App.num(visibleCount)} รายการ${visibleCount !== allCount ? ' (จาก ' + App.num(allCount) + ')' : ''}${serverPage ? ' <span class="loading-dots">กำลังโหลดส่วนที่เหลือ</span>' : ''}</p></div>
        <div class="actions no-print">
          ${canEdit ? '<button type="button" class="primary-button" data-act="add"><i class="fa-solid fa-plus"></i> เพิ่มข้อมูล</button>' : ''}
          ${canEdit ? '<button type="button" class="secondary-button" data-act="import"><i class="fa-solid fa-file-import"></i> นำเข้า CSV</button>' : ''}
          <button type="button" class="secondary-button" data-act="export"><i class="fa-solid fa-file-export"></i> ส่งออก</button>
          <button type="button" class="secondary-button" data-act="print"><i class="fa-solid fa-print"></i> พิมพ์</button>
          <button type="button" class="icon-button" data-act="reload" title="โหลดใหม่"><i class="fa-solid fa-rotate"></i></button>
        </div></div>
      <div class="toolbar">
        ${entity.yearScoped ? `<label>ปีการศึกษา<select data-year>${App.yearOptions()}</select></label>` : ''}
        ${filters}
        <label class="grow">ค้นหา<input type="search" data-search value="${App.attr(state.q)}" placeholder="พิมพ์คำค้น"></label>
      </div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th class="num">#</th>
        ${listFields.map((field) => `<th><span data-tkey="f:${App.attr(key)}.${App.attr(field.key)}">${App.esc(field.label)}</span></th>`).join('')}<th class="no-print"></th></tr></thead>
        <tbody>${pageRows.length ? pageRows.map((row, index) => `<tr>
          <td class="num">${(state.page - 1) * PAGE_SIZE + index + 1}</td>
          ${listFields.map((field) => `<td>${cellHtml(field, row)}</td>`).join('')}
          <td class="actions no-print">
            ${actions.map((action, actionIndex) => (!action.permission || App.can(action.permission))
              ? `<button type="button" class="ghost-button" data-custom="${actionIndex}" data-id="${App.attr(row.id)}"><i class="fa-solid ${App.attr(action.icon)}"></i> ${App.esc(action.label)}</button>` : '').join('')}
            <button type="button" class="ghost-button" data-view="${App.attr(row.id)}" title="ดูรายละเอียด"><i class="fa-regular fa-eye"></i></button>
            ${canEdit ? `<button type="button" class="ghost-button" data-edit="${App.attr(row.id)}" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
            <button type="button" class="ghost-button danger" data-delete="${App.attr(row.id)}" title="ลบ"><i class="fa-solid fa-trash"></i></button>` : ''}
          </td></tr>`).join('') : `<tr><td colspan="${listFields.length + 2}" class="empty-row">ยังไม่มีข้อมูล${canEdit ? ' กด “เพิ่มข้อมูล” หรือ “นำเข้า CSV” เพื่อเริ่มต้น' : ''}</td></tr>`}</tbody></table></div>
      ${pageCount > 1 ? `<div class="pager no-print"><span>หน้า ${state.page} / ${pageCount}</span><span>
        <button type="button" class="secondary-button" data-page="-1" ${state.page === 1 ? 'disabled' : ''}>ก่อนหน้า</button>
        <button type="button" class="secondary-button" data-page="1" ${state.page === pageCount ? 'disabled' : ''}>ถัดไป</button></span></div>` : ''}
    </section><div id="entity-after"></div>`);

    const root = document.getElementById('page-content');
    const rerender = () => App.renderEntity(key, module);
    const yearSelect = root.querySelector('[data-year]');
    if (yearSelect) yearSelect.addEventListener('change', () => { App.state.yearId = yearSelect.value; state.filters = {}; state.page = 1; rerender(); });
    root.querySelectorAll('[data-filter]').forEach((select) => select.addEventListener('change', () => { state.filters[select.dataset.filter] = select.value; state.page = 1; rerender(); }));
    const search = root.querySelector('[data-search]');
    let timer = null;
    search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { state.q = search.value.trim(); state.page = 1; rerender().then(() => {
      const input = root.querySelector('[data-search]'); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }); }, 250); });
    root.querySelectorAll('[data-page]').forEach((button) => button.addEventListener('click', () => { state.page += Number(button.dataset.page); rerender(); }));
    root.querySelectorAll('[data-file]').forEach((button) => button.addEventListener('click', () => App.openFile(button.dataset.file)));
    const find = (id) => rows.find((row) => String(row.id) === String(id));
    const view = (row) => (App.entityOpen[key] ? App.entityOpen[key](row, rerender) : openDetail(entity, row));
    root.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => view(find(button.dataset.view))));
    root.querySelectorAll('[data-edit]').forEach((button) => button.addEventListener('click', () => openForm(entity, find(button.dataset.edit), rerender)));
    root.querySelectorAll('[data-delete]').forEach((button) => button.addEventListener('click', () => removeRow(entity, find(button.dataset.delete), rerender)));
    root.querySelectorAll('[data-custom]').forEach((button) => button.addEventListener('click', () => actions[Number(button.dataset.custom)].handler(find(button.dataset.id), entity)));
    const act = (name, handler) => { const button = root.querySelector(`[data-act="${name}"]`); if (button) button.addEventListener('click', handler); };
    act('add', () => openForm(entity, null, rerender, App.entityDefaults[key] ? App.entityDefaults[key]() : undefined));
    act('import', () => openImport(entity, rerender));
    act('export', async () => {
      const all = serverPage ? await loadRows(entity) : null;
      exportCsv(entity, serverPage ? (all || []).filter((row) => matches(entity, row, state)) : visible);
    });
    act('print', () => window.print());
    act('reload', async () => { await loadRows(entity, true); rerender(); });
    // ส่วนท้าย (เช่น ตารางสอนแบบตาราง) ต้องใช้ข้อมูลครบ: รอจนโหลดทั้งหมดเสร็จ
    if (App.entityAfter[key] && !serverPage) App.entityAfter[key](document.getElementById('entity-after'), visible, state);
    if (App.pendingOpen && App.pendingOpen.entity === key && !serverPage) {
      const target = find(App.pendingOpen.id);
      App.pendingOpen = null;
      if (target) view(target); else App.toast('ไม่พบรายการนี้ในปีการศึกษาที่เลือก ลองเปลี่ยนปีการศึกษาด้านบน', 'error');
    }
  };

  function inputFor(field, value, entity) {
    const name = App.attr(field.key);
    const required = field.required ? 'required' : '';
    switch (field.type) {
      case 'textarea': return `<textarea name="${name}" ${required} rows="${field.max > 3000 ? 8 : 4}">${App.esc(value ?? '')}</textarea>`;
      case 'number': return `<input name="${name}" type="number" step="any" min="0" ${field.max ? `max="${field.max}"` : ''} value="${App.attr(value ?? '')}" ${required}>`;
      case 'date': return `<input name="${name}" type="date" value="${App.attr(value || '')}" ${required}>`;
      case 'checkbox': return `<span class="check-row"><input name="${name}" type="checkbox" ${value === true ? 'checked' : ''}> ใช่</span>`;
      case 'select': return `<select name="${name}" ${required}><option value="">— เลือก —</option>${field.options.map((option) => `<option ${option === value ? 'selected' : ''}>${App.esc(option)}</option>`).join('')}</select>`;
      case 'ref': return `<select name="${name}" ${required}>${App.options(field.ref, value, { yearId: ['homerooms', 'strategies', 'projects'].includes(field.ref) && entity.yearScoped ? App.state.yearId : '' })}</select>`;
      case 'year': return `<select name="${name}" ${required}>${App.yearOptions(value || App.state.yearId)}</select>`;
      case 'file': return `<input name="${name}" type="file" ${field.accept ? `accept="${App.attr(field.accept)}"` : ''}>
        ${value ? `<small class="muted">มีไฟล์แล้ว <button type="button" class="ghost-button" data-file="${App.attr(value)}">เปิดไฟล์</button> (เลือกไฟล์ใหม่เพื่อแทนที่)</small>` : ''}`;
      default: return `<input name="${name}" value="${App.attr(value ?? '')}" ${field.max ? `maxlength="${field.max}"` : ''} ${required}>`
        + (field.geo === 'lat' ? '<button type="button" class="ghost-button" data-geo><i class="fa-solid fa-location-crosshairs"></i> ใช้ตำแหน่งปัจจุบัน</button>' : '');
    }
  }

  function openDetail(entity, row) {
    if (!row) return;
    const body = App.openModal(entity.label, `<table class="data-table">${entity.fields.filter((field) => !field.hidden).map((field) => `<tr><th style="width:38%">${App.esc(field.label)}</th>
      <td style="white-space:pre-line">${field.type === 'file' ? cellHtml(field, row) : App.esc(cellText(field, row[field.key]))}</td></tr>`).join('')}
      <tr><th>บันทึกล่าสุด</th><td>${App.fmtDateTime(row.updatedAt)}</td></tr></table>`);
    body.querySelectorAll('[data-file]').forEach((button) => button.addEventListener('click', () => App.openFile(button.dataset.file)));
  }

  function openForm(entity, row, done, defaults) {
    const values = row || {};
    const fields = entity.fields.filter((field) => !field.computed && !field.system);
    const body = App.openModal((row ? 'แก้ไข' : 'เพิ่ม') + entity.label, `<form class="form-grid" novalidate>
      ${fields.map((field) => {
        const value = row ? values[field.key] : (defaults && defaults[field.key] !== undefined ? defaults[field.key]
          : field.defaultValue !== undefined ? field.defaultValue : '');
        const wide = field.type === 'textarea' || field.type === 'file' ? 'wide' : '';
        return `<label class="${wide}">${App.esc(field.label)}${field.required ? ' <span class="c-rose">*</span>' : ''}
          ${inputFor(field, value, entity)}<small class="field-error" data-error-for="${App.attr(field.key)}"></small></label>`;
      }).join('')}
      <p class="form-error wide" data-form-error></p>
      <div class="form-actions wide"><button type="button" class="secondary-button" data-cancel>ยกเลิก</button>
        <button type="submit" class="primary-button"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div></form>`);
    const form = body.querySelector('form');
    body.querySelectorAll('[data-file]').forEach((button) => button.addEventListener('click', () => App.openFile(button.dataset.file)));
    body.querySelector('[data-cancel]').addEventListener('click', App.closeModal);
    bindGeo(form, entity);
    if (App.entityFormReady[entity.key]) App.entityFormReady[entity.key](form, row);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      App.clearErrors(form);
      const payload = {};
      for (const field of fields) {
        const input = form.elements[field.key];
        if (field.type === 'checkbox') payload[field.key] = input.checked;
        else if (field.type === 'file') {
          payload[field.key] = values[field.key] || '';
          const file = input.files[0];
          if (file) {
            if (file.size > 8 * 1024 * 1024) { App.showErrors(form, { fieldErrors: { [field.key]: 'ไฟล์ต้องไม่เกิน 8 MB' } }); return; }
            const upload = await App.call('file.upload', { entity: entity.key, name: file.name, mimeType: file.type, base64: await App.fileToBase64(file) });
            if (!upload.ok) return;
            payload[field.key] = upload.data.fileId;
          }
        } else payload[field.key] = input.value;
      }
      if (App.entityBeforeSave[entity.key]) {
        const submit = form.querySelector('[type=submit]');
        submit.disabled = true;
        const ready = await App.entityBeforeSave[entity.key](payload, row);
        submit.disabled = false;
        if (ready === false) return;
      }
      const response = await App.call('entity.save', { entity: entity.key, id: row && row.id, version: row && row.version, values: payload }, { quiet: true });
      if (!response.ok) {
        App.showErrors(form, response.error);
        form.querySelector('[data-form-error]').textContent = response.error.message;
        return;
      }
      App.closeModal();
      App.toast('บันทึกแล้ว', 'success');
      await afterChange(entity, response.data && response.data.id ? { type: 'save', record: response.data } : null);
      done();
    });
  }

  // เติมละติจูด/ลองจิจูดจาก GPS ของอุปกรณ์
  function bindGeo(form, entity) {
    const button = form.querySelector('[data-geo]');
    if (!button) return;
    const lat = entity.fields.find((field) => field.geo === 'lat');
    const lng = entity.fields.find((field) => field.geo === 'lng');
    button.addEventListener('click', () => {
      if (!navigator.geolocation) return App.toast('อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง', 'error');
      button.disabled = true;
      navigator.geolocation.getCurrentPosition((position) => {
        form.elements[lat.key].value = position.coords.latitude.toFixed(6);
        form.elements[lng.key].value = position.coords.longitude.toFixed(6);
        button.disabled = false;
        App.toast('ได้ตำแหน่งแล้ว (คลาดเคลื่อนประมาณ ' + Math.round(position.coords.accuracy) + ' เมตร)', 'success');
      }, () => { button.disabled = false; App.toast('ไม่สามารถระบุตำแหน่งได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง', 'error'); },
      { enableHighAccuracy: true, timeout: 15000 });
    });
  }

  async function removeRow(entity, row, done) {
    if (!row || !confirm('ยืนยันการลบรายการนี้?')) return;
    const response = await App.call('entity.delete', { entity: entity.key, id: row.id, version: row.version });
    if (!response.ok) return;
    App.toast('ลบแล้ว', 'success');
    await afterChange(entity, { type: 'delete', record: row });
    done();
  }

  // ปรับข้อมูลที่โหลดไว้ในหน้าเว็บทันทีตามที่เพิ่งบันทึก (เห็นผลไม่ต้องรอเซิร์ฟเวอร์/ไม่ต้องรีโหลด)
  // แล้วโหลดจากเซิร์ฟเวอร์เบื้องหลังเพื่อเทียบให้ตรงกัน (ลำดับ/ค่าที่เซิร์ฟเวอร์คำนวณ)
  function patchLocal(entity, change) {
    const prefix = 'entity:' + entity.key + ':';
    let patched = false;
    Object.keys(App.state.cache).filter((key) => key.startsWith(prefix)).forEach((key) => {
      const rows = App.state.cache[key];
      if (!Array.isArray(rows)) return;
      const scope = key.slice(prefix.length);
      const record = change.record;
      const belongs = change.type === 'save' && (!entity.yearScoped || String(record.academicYearId) === scope);
      const index = rows.findIndex((row) => String(row.id) === String(record.id));
      const next = rows.slice();
      if (belongs) { if (index >= 0) next[index] = record; else next.unshift(record); }
      else if (index >= 0) next.splice(index, 1);
      else return;
      App.remember(key, next);
      patched = true;
    });
    return patched;
  }

  function reconcile(entity) {
    const key = dataKey(entity, App.state.yearId);
    const started = generation;
    App.request('entity.list', { entity: entity.key, academicYearId: entity.yearScoped ? App.state.yearId : '' }).then((response) => {
      if (!response.ok || started !== generation || !response.data.rows) return;
      App.remember(key, response.data.rows);
      const module = modules[entity.key];
      const modal = document.getElementById('modal');
      if (!module || location.hash !== module.route || (modal && modal.open)) return;
      const active = document.activeElement;
      if (active && active.matches && active.matches('[data-search]')) return;
      App.renderEntity(entity.key, module);
    });
  }

  async function afterChange(entity, change) {
    generation += 1;
    App.forget('report:');
    App.forget('dashboard:map'); // แผนที่บนแดชบอร์ดใช้พิกัดจากเยี่ยมบ้าน แจ้งเหตุ และจุดเสี่ยง
    if (change && patchLocal(entity, change)) {
      reconcile(entity);
    } else App.forget('entity:' + entity.key + ':');
    if (LOOKUP_ENTITIES[entity.key]) App.refreshLookups();
  }

  function exportCsv(entity, rows) {
    const fields = entity.fields.filter((field) => field.type !== 'file' && !field.hidden);
    App.downloadCsv(entity.label + '.csv', fields.map((field) => field.label),
      rows.map((row) => fields.map((field) => field.type === 'checkbox' ? (row[field.key] === true ? 'ใช่' : '') : cellText(field, row[field.key]))));
  }

  // ---------- นำเข้า CSV ----------
  function resolveRef(field, text) {
    const value = String(text || '').trim();
    if (!value) return '';
    const ref = field.type === 'year' ? 'academicYears' : field.ref;
    const list = App.lookupList(ref);
    const lower = value.toLowerCase();
    const found = list.find((item) => String(item.label).toLowerCase() === lower || (item.code && String(item.code).toLowerCase() === lower));
    return found ? found.id : '__notfound__:' + value;
  }

  function normalizeDate(text) {
    const value = String(text || '').trim();
    let match = value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (match) return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
    match = value.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    if (match) { let year = Number(match[3]); if (year > 2400) year -= 543; return `${year}-${match[2].padStart(2, '0')}-${match[1].padStart(2, '0')}`; }
    return value;
  }

  function openImport(entity, done) {
    const fields = entity.fields.filter((field) => !field.computed && field.type !== 'file');
    const body = App.openModal('นำเข้า ' + entity.label, `<ol class="muted">
        <li>ดาวน์โหลดแบบฟอร์ม แล้วกรอกข้อมูลใน Excel หรือ Google Sheets</li>
        <li>ช่องที่อ้างอิงข้อมูลอื่น (เช่น คำนำหน้า ห้องเรียน นักเรียน) ให้พิมพ์ชื่อตามที่มีในระบบ หรือรหัส/เลขประจำตัว</li>
        <li>บันทึกเป็นไฟล์ CSV (UTF-8) แล้วเลือกไฟล์ด้านล่าง ระบบจะตรวจทุกแถวก่อนบันทึก</li></ol>
      <div class="form-actions" style="justify-content:flex-start"><button type="button" class="secondary-button" data-template><i class="fa-solid fa-download"></i> ดาวน์โหลดแบบฟอร์ม</button></div>
      <label style="margin-top:14px">ไฟล์ CSV<input type="file" accept=".csv,.tsv,.txt,text/csv,text/plain,application/vnd.ms-excel" data-csv></label>
      <label style="margin-top:10px">หรือคัดลอกข้อมูลจาก Excel / Google Sheets (รวมแถวหัวตาราง) มาวางที่นี่
        <textarea rows="4" data-paste placeholder="วางข้อมูลที่นี่ แล้วกด “ตรวจข้อมูลที่วาง”"></textarea></label>
      <div class="form-actions" style="justify-content:flex-start"><button type="button" class="secondary-button" data-check-paste><i class="fa-solid fa-list-check"></i> ตรวจข้อมูลที่วาง</button></div>
      <div data-preview class="muted" style="margin-top:10px"></div>
      <div class="form-actions"><button type="button" class="secondary-button" data-cancel>ยกเลิก</button>
        <button type="button" class="primary-button" data-run disabled><i class="fa-solid fa-file-import"></i> นำเข้า</button></div>`);
    let parsed = [];
    body.querySelector('[data-cancel]').addEventListener('click', App.closeModal);
    body.querySelector('[data-template]').addEventListener('click', () => App.downloadCsv('แบบฟอร์ม-' + entity.label + '.csv', fields.map((field) => field.label), [], { back: () => openImport(entity, done) }));
    body.querySelector('[data-csv]').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (file) loadText(await file.text());
    });
    body.querySelector('[data-check-paste]').addEventListener('click', () => loadText(body.querySelector('[data-paste]').value));
    function loadText(text) {
      const preview = body.querySelector('[data-preview]');
      const table = App.parseCsv(text);
      if (table.length < 2) { preview.textContent = 'ไม่พบข้อมูลในไฟล์'; return; }
      const header = table[0].map((cell) => String(cell).trim());
      const mapping = header.map((name) => fields.find((field) => field.label === name || field.key === name) || null);
      const unknown = header.filter((name, index) => !mapping[index] && name);
      parsed = table.slice(1).map((cells) => {
        const values = {};
        if (entity.yearScoped) values.academicYearId = App.state.yearId;
        mapping.forEach((field, index) => {
          if (!field) return;
          const raw = cells[index] ?? '';
          if (field.type === 'ref' || field.type === 'year') values[field.key] = resolveRef(field, raw) || (field.type === 'year' ? App.state.yearId : '');
          else if (field.type === 'date') values[field.key] = normalizeDate(raw);
          else if (field.type === 'checkbox') values[field.key] = /^(ใช่|true|1|y|yes)$/i.test(String(raw).trim());
          else values[field.key] = String(raw).trim();
        });
        return values;
      });
      const notFound = [];
      parsed.forEach((values, index) => Object.entries(values).forEach(([key, value]) => {
        if (String(value).startsWith('__notfound__:')) { notFound.push(`แถว ${index + 2}: ไม่พบ "${String(value).slice(13)}"`); values[key] = 'not-found'; }
      }));
      preview.innerHTML = `พบ ${App.num(parsed.length)} แถว` +
        (unknown.length ? `<br>คอลัมน์ที่ไม่รู้จัก (ข้าม): ${App.esc(unknown.join(', '))}` : '') +
        (notFound.length ? `<br><span class="c-rose">${App.esc(notFound.slice(0, 10).join(' | '))}</span>` : '');
      body.querySelector('[data-run]').disabled = !parsed.length;
    }
    body.querySelector('[data-run]').addEventListener('click', async () => {
      const response = await App.call('entity.import', { entity: entity.key, rows: parsed }, { quiet: true });
      const preview = body.querySelector('[data-preview]');
      if (!response.ok) {
        const rows = (response.error.fieldErrors && response.error.fieldErrors.rows) || [];
        preview.innerHTML = `<p class="form-error">${App.esc(response.error.message)}</p>` + rows.slice(0, 20).map((row) =>
          `<div>แถว ${row.row}: ${App.esc(Object.entries(row.errors).map(([key, message]) => {
            const field = fields.find((item) => item.key === key); return (field ? field.label : key) + ' ' + message; }).join(', '))}</div>`).join('');
        return;
      }
      App.closeModal();
      App.toast('นำเข้าแล้ว ' + App.num(response.data.imported) + ' แถว', 'success');
      await afterChange(entity);
      done();
    });
  }

  App.entityCellText = cellText;
  App.entityCellHtml = cellHtml;
  App.openEntityForm = (key, row, done, defaults) => openForm(App.state.entities[key], row, done || (() => {}), defaults);
  App.openEntityDetail = (key, row) => openDetail(App.state.entities[key], row);
  App.reloadEntity = (key) => App.forget('entity:' + key + ':');
})();
</script>
